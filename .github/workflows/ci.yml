name: CI
on:
  pull_request:
  push:
    branches: [main]
# T1 of the tiered tests (M6-F8, docs/specs/test-tiers.json): independent jobs run in parallel: lint and typecheck
# (with the tiers this change needs in the run summary), the unit tests in shards balanced by file time, the
# real-Postgres tests, the offline infra and matting tests, and the intake browser scenarios. A run takes as long as its
# slowest job instead of the sum of every step; the budget is 10 minutes.
jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit too, so the tiers step can list what this PR changed.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # M6-F8: the tiers this change needs (T1 always; T2 and T3 by path), written to the run summary.
      - name: Test tiers this change needs
        if: github.event_name == 'pull_request'
        run: node .github/ci/tiers.mjs "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # M6-F2-R1 (M6-S4): new migrations are additive only (expand and contract); a contract step carries a
      # "-- contract: <release>" line and ships one release after the code stops using what it removes.
      - name: migrations are additive
        run: node packages/core/scripts/check-migrations.mjs

  test:
    name: unit tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its own failures; one failing shard does not cancel the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` (vitest run), one shard of it. M6-S7a: the shards are balanced by each file's measured seconds
      # (.github/ci/shards.mjs, .github/ci/test-timings.json), not by vitest's --shard (an equal count of files), which
      # put the heaviest files together and made one shard the critical path. Every file vitest lists goes to exactly
      # one shard, a new file included. T40's 200 sequences are 8 files (enlarge.model.t40-<n>.test.ts) so they spread.
      - name: Unit tests
        run: |
          pnpm exec vitest list --filesOnly > "$RUNNER_TEMP/test-files.txt"
          node .github/ci/shards.mjs ${{ matrix.shard }} 6 < "$RUNNER_TEMP/test-files.txt" > "$RUNNER_TEMP/shard-files.txt"
          xargs -r -a "$RUNNER_TEMP/shard-files.txt" pnpm exec vitest run

  # M0 decision D11 (M6-S7a): the contract tests that need real Postgres (TEST_PG_URL; on PGlite they skip or run a
  # weaker form) run against a throwaway Postgres 16, the version of ila-pg. Each test file creates and drops its own
  # database (packages/core/src/db/testing.ts createRealTestDb). Every test file that reads TEST_PG_URL runs here; the
  # unit shards run the same files on PGlite.
  postgres:
    name: real Postgres tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real Postgres tests
        run: |
          grep -rl --include='*.test.ts' --exclude-dir=node_modules TEST_PG_URL apps packages | sort > "$RUNNER_TEMP/pg-files.txt"
          cat "$RUNNER_TEMP/pg-files.txt"
          test -s "$RUNNER_TEMP/pg-files.txt" || { echo "no test file reads TEST_PG_URL"; exit 1; }
          xargs -r -a "$RUNNER_TEMP/pg-files.txt" pnpm exec vitest run

  infra-matting:
    name: infra and matting tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Offline infra tests (fake gcloud, no GCP): the deploy gate, shape refusals, the check-matting probe,
      # monitoring, queue names. Any failing file fails the step. They use node built-ins only (no pnpm install).
      - name: Infra tests
        run: for t in infra/tests/*.test.mjs; do echo "== $t"; node "$t" || exit 1; done
      # Matting service tests with mocked inference; the image builds run them too, here they run on every PR.
      # rembg and onnxruntime are left out (the tests stub both); every other pin comes from requirements-cpu.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Matting service tests
        run: |
          grep -vE '^(rembg|onnxruntime)' services/matting/requirements-cpu.txt > "$RUNNER_TEMP/matting-requirements.txt"
          pip install -r "$RUNNER_TEMP/matting-requirements.txt" -r services/matting/requirements-test.txt
          python -m pytest services/matting/tests -q

  browser:
    name: intake browser scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Intake browser scenarios (spec 14 section 8.3): local harness, no GCP, no deployed service.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @catalog/web exec playwright install --with-deps chromium
      - name: Intake browser scenarios
        run: pnpm --filter @catalog/web exec playwright test --config test/catalog-intake.config.ts
      - name: Keep the browser test videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-intake-browser
          path: apps/web/test-results/catalog-intake/
          if-no-files-found: ignore
