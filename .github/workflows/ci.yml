name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Intake browser scenarios (spec 14 section 8.3): local harness, no GCP, no deployed service.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @catalog/web exec playwright install --with-deps chromium
      - name: Intake browser scenarios
        run: pnpm --filter @catalog/web exec playwright test --config test/catalog-intake.config.ts
      - name: Keep the browser test videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-intake-browser
          path: apps/web/test-results/catalog-intake/
          if-no-files-found: ignore
