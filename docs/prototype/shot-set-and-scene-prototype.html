<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Set Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;600;700&family=Raleway:wght@400;500;600&display=swap">
<style>
/* Prototype of specs 12 (apparel shot set) and 13 (footwear and bag scene image). Look copied from catalog-prototype.html. */
:root{--navy:#131A48;--orange:#FF5800;--orange-h:#FF8C4F;--yellow:#FFFCE8;--grey:#5A5A5A;--grey-l:#CECECE;--bg:#FFFFFF;--fg:#1b1b1f;--muted:#5A5A5A;--line:#dedbd3;--card:#FFFFFF;--soft:#f6f5f0;--ok:#1f7a3f;--warn:#b86e00;--bad:#b3261e;--run:#1d2a7a;--proto:#fff1e8;--font-h:'Spectral',Georgia,serif;--font-b:'Raleway','Segoe UI',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1330;--fg:#f1f1f4;--muted:#b9bcc9;--line:#2b315c;--card:#171c3f;--soft:#141839;--yellow:#2a2a1a;--grey-l:#3a3f66;--ok:#6fd49a;--warn:#f0b35a;--bad:#ff8a80;--run:#c9d0ff;--proto:#2e1d14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1330;--fg:#f1f1f4;--muted:#b9bcc9;--line:#2b315c;--card:#171c3f;--soft:#141839;--yellow:#2a2a1a;--grey-l:#3a3f66;--ok:#6fd49a;--warn:#f0b35a;--bad:#ff8a80;--run:#c9d0ff;--proto:#2e1d14;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;margin:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;margin:0;text-wrap:balance;color:var(--fg)}
h1{font-size:30px;font-weight:300;letter-spacing:-0.02em}h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
a{color:var(--orange)}
p{margin:6px 0}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.top .in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.logo{font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:-0.02em;color:#fff;text-decoration:none}
.nav a{color:#fff;text-decoration:none;opacity:.8;margin-right:14px;font-weight:500}.nav a.on{opacity:1;border-bottom:2px solid var(--orange);padding-bottom:4px}
.proto{font-size:12px;background:var(--orange);color:#fff;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ub{font:inherit;font-size:13px;font-weight:500;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;cursor:pointer}
.ub:hover{border-color:#fff}.ub:focus-visible{outline:3px solid var(--orange-h);outline-offset:2px}
.seat{display:flex;align-items:center;gap:6px;font-size:13px}
.seat select{font:inherit;font-size:13px;background:#1f2760;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:5px 8px}
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lead{color:var(--muted);max-width:68ch;margin-top:6px}
.btn{font-family:var(--font-b);font-weight:600;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.3}
:root[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.ok):not(.danger){background:#2c3680;border-color:#3d4aa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.primary):not(.ghost):not(.ok):not(.danger){background:#2c3680;border-color:#3d4aa0}}
.btn.primary{background:var(--orange);border-color:var(--orange)}.btn.primary:hover{background:var(--orange-h);border-color:var(--orange-h)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--grey-l)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}.btn:focus-visible{outline:3px solid var(--orange-h);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{font:inherit;background:none;border:0;padding:0;color:var(--orange);cursor:pointer;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
.tw table{min-width:640px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--fg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:#e4f5ea;color:#145a2e;border-color:#bfe5cc}.pill.warn{background:#fff3dc;color:#7a4a00;border-color:#f3d79a}.pill.run{background:#e8ecff;color:#1d2a7a;border-color:#c3cbff}.pill.bad{background:#fde7e5;color:#8a1c16;border-color:#f6b9b4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.ok{background:#173a26;color:#9fe3b6;border-color:#245a3a}:root:not([data-theme="light"]) .pill.warn{background:#3d2e10;color:#f5cf85;border-color:#5c4518}:root:not([data-theme="light"]) .pill.run{background:#1f2a66;color:#c9d0ff;border-color:#33408a}:root:not([data-theme="light"]) .pill.bad{background:#4a1b18;color:#ffb3ad;border-color:#6d2a25}}
:root[data-theme="dark"] .pill.ok{background:#173a26;color:#9fe3b6;border-color:#245a3a}:root[data-theme="dark"] .pill.warn{background:#3d2e10;color:#f5cf85;border-color:#5c4518}:root[data-theme="dark"] .pill.run{background:#1f2a66;color:#c9d0ff;border-color:#33408a}:root[data-theme="dark"] .pill.bad{background:#4a1b18;color:#ffb3ad;border-color:#6d2a25}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--grey-l);font-size:13px}
.steps li.on{color:var(--fg)}.steps li.on::before{background:var(--orange);border-color:var(--orange);color:#fff}
.steps li.done::before{background:var(--navy);border-color:var(--navy);color:#fff;content:"\2713"}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=date],textarea{font:inherit;padding:8px 10px;border:1px solid var(--grey-l);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
.full{width:100%}
textarea{min-height:80px;resize:vertical;width:100%}
.help{color:var(--muted);font-size:13px;margin-top:6px}
.note{color:var(--muted);font-size:12px;font-style:italic}
.drop{border:2px dashed var(--grey-l);border-radius:10px;padding:22px;text-align:center;background:var(--soft);cursor:pointer}
.drop:hover{border-color:var(--orange)}.drop b{display:block;font-size:16px;margin-bottom:4px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;cursor:pointer}
.opt input{width:18px;height:18px;margin-top:3px;accent-color:var(--orange)}
.opt small{display:block;color:var(--muted)}
.opt.inline{display:inline-grid;margin-left:8px}
.chan{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ch{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.ch input{width:18px;height:18px;margin-top:3px;accent-color:var(--orange)}
.ch.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset}
.ch b{display:block}.ch small{color:var(--muted);display:block;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.kpi{padding:10px 14px;border-left:3px solid var(--navy);background:var(--soft);border-radius:6px}.kpi b{display:block;font-size:22px;font-family:var(--font-h);font-weight:600}.kpi span{color:var(--muted);font-size:13px}
.kpi.o{border-left-color:var(--orange)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 16px;flex-wrap:wrap}
.tabs a{font-weight:600;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);text-decoration:none}
.tabs a.on{color:var(--fg);border-bottom-color:var(--orange)}
.banner{display:grid;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.banner .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1 1 200px;min-width:120px}.bar i{display:block;height:100%;background:var(--orange);border-radius:999px}
.notice{background:var(--yellow);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin:10px 0}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.err{border-left:3px solid var(--bad);background:var(--soft);padding:10px 12px;border-radius:6px;margin:8px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(19,26,72,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal .card{max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);z-index:25;overflow:auto;padding:16px 16px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer h2{font-size:20px}
.drawer section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.drawer .sw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.drawer .sw select{font-size:13px;padding:4px 6px}
.pbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7a2e00;background:#ffe2cf;border:1px dashed var(--orange);border-radius:6px;padding:2px 8px}
:root[data-theme="dark"] .pbadge{color:#ffd2b5;background:#3a2213}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbadge{color:#ffd2b5;background:#3a2213}}
.protobox{border:1px dashed var(--orange);background:var(--proto);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px}
.chain{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;margin:8px 0}
.chain span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.chain span.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.chain span.done{background:var(--soft);color:var(--muted)}
.guide-item{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.guide-item input{width:18px;height:18px;accent-color:var(--orange);margin-top:2px}
.guide-item .gid{font-weight:700;margin-right:4px}
/* Images */
svg.ph{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:#ecebe7}
figure{margin:0}
figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.strip figure{width:64px;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.thumbs figure{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin:2px 4px 0 0}
.badge.cut{background:#fde7e5;color:#8a1c16}.badge.made{background:#e8ecff;color:#1d2a7a}.badge.crop{background:#e4f5ea;color:#145a2e}
/* Review cards */
.att{display:grid;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);outline:none}
.rc.focus{box-shadow:0 0 0 3px var(--orange-h)}
.rc header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.rc-main{display:grid;grid-template-columns:minmax(0,220px) minmax(0,150px) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.rc-main.two{grid-template-columns:minmax(0,180px) minmax(0,180px) minmax(0,1fr)}
.rc-main.scene{grid-template-columns:minmax(0,110px) minmax(0,230px) minmax(0,1fr)}
@media (max-width:820px){.rc-main,.rc-main.two,.rc-main.scene{grid-template-columns:1fr 1fr}.rc-main .why{grid-column:1/-1}}
.why p{margin:4px 0 10px}
.checkline{border-left:3px solid var(--navy);padding:6px 10px;background:var(--soft);border-radius:4px;font-size:14px}
.answers{font-size:13px;color:var(--muted);margin:8px 0}
.result{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--soft)}
.picks{display:grid;gap:2px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.picks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.picks input{accent-color:var(--orange);margin-top:3px}
.qlist{display:grid;gap:4px;margin:8px 0}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.qrow small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.qrow small.bad{color:var(--bad)}
.yn{display:inline-flex;border:1px solid var(--grey-l);border-radius:6px;overflow:hidden}
.yn button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--fg);padding:3px 10px;cursor:pointer}
.yn button.on{background:var(--navy);color:#fff}
.yn button.on.no{background:var(--bad)}
.kbd{font-family:ui-monospace,Consolas,monospace;border:1px solid var(--grey-l);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
.crops{display:flex;gap:8px;flex-wrap:wrap}
.crops figure{width:64px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.chip.ok{background:#e4f5ea;color:#145a2e;border-color:#bfe5cc}.chip.warn{background:#fff3dc;color:#7a4a00;border-color:#f3d79a}.chip.bad{background:#fde7e5;color:#8a1c16;border-color:#f6b9b4}.chip.run{background:#e8ecff;color:#1d2a7a;border-color:#c3cbff}
.pend{color:var(--muted);font-style:italic}
.plist{display:grid;gap:12px}
.prow{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px}
@media (max-width:760px){.prow{grid-template-columns:1fr}}
.chrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;align-items:start;font-size:13px;padding:3px 0}
.lines{margin:0;padding-left:18px}.lines li{margin:4px 0}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.subnav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);font-size:14px}
.subnav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.faces svg{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#ecebe7}
.sheet table td,.sheet table th{white-space:nowrap;font-size:13px;padding:7px 9px}
.sheet td.notes{white-space:normal;min-width:320px}
.sheet td.wrap{white-space:normal;min-width:220px}
.sheet .merged{text-align:center;background:var(--soft);font-weight:600}
.legend{display:grid;gap:6px;margin-top:12px;font-size:14px}
.legend div{display:grid;grid-template-columns:140px 1fr;gap:10px}
@media (max-width:560px){.legend div{grid-template-columns:1fr}}
.inline-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rolelist{display:grid;gap:6px;margin:8px 0}
.rolelist .rr{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center}
.bars{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:14px}
.bars li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.bars .y{color:var(--ok);font-weight:700}.bars .n{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.sm{font-size:13px}
.hide{display:none!important}
.att,.plist{grid-template-columns:minmax(0,1fr)}
.prow>*,.rc-main>*,.rc,.chrow>*{min-width:0}
.pill.warn{white-space:normal}
.inline-sel label{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:100%}
.inline-sel select{max-width:100%;min-width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){h1{font-size:25px}.top .in{gap:8px}.nav a{margin-right:8px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="logo" href="#home">Opptra</a>
  <nav class="nav" id="nav"></nav>
  <div class="tright">
    <span class="proto">Prototype only</span>
    <label class="seat">You are
      <select id="seat" onchange="setSeat(this.value)" aria-label="You are">
        <option value="naz">Operator Naz</option>
        <option value="rater2">Second rater</option>
        <option value="admin">Admin</option>
      </select></label>
    <button class="ub" onclick="openDrawer('controls')">Test controls</button>
    <button class="ub" onclick="openDrawer('guide')">Test guide</button>
  </div>
</div></div>
<main id="app"></main>
<aside id="drawer" class="drawer" hidden></aside>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ============ Utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=x=>(Math.round(x*100)/100).toFixed(2)+' USD';
const TODAY='27 Oct 2026';
const plural=(n,one,many)=>n===1?one:many;
function clock(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
const clone=o=>JSON.parse(JSON.stringify(o));

/* ============ Words and rules (copy from specs 12 and 13) ============ */

  star.amazon=mk([['fm','fl'],'fc','bh'],'confirmed','amazon_nose_lip');
  const copy=(st)=>{const o={};for(const c in star)o[c]=Object.assign(clone(star[c]),{status:st});return o};

  rows.dresses_jumpsuits=copy('proposed');rows.dresses_jumpsuits.amazon.roles=['fl','fc','bl'];
  rows.outerwear=copy('proposed');

  for(const d of ['lingerie_underwear','swimwear','kids']){const o={};CH_ORDER.forEach(c=>o[c]=mk(['flat','fb','fc'],'proposed'));rows[d]=o}

function findJob(jid){for(const id in S.batches){const j=S.batches[id].jobs.find(x=>x.id===jid);if(j)return {b:S.batches[id],j,p:S.batches[id].products.find(x=>x.id===j.pid)}}return {}}

const PENDING=['planned','making','checking','in_review','held','waiting'];
function modeBOk(brand){const r=S.registry[brand];return !!(r&&r.pack==='approved'&&!r.deleted)}

function ctxFor(b){const brandOn=S.sw.making[b.brand];const df=detectFailed(b);return {channels:b.channels,make:brandOn&&b.makeTicked&&!df,makeReason:!brandOn?'making_off':'batch_off',modeB:modeBOk(b.brand)}}

/* ============ Planner (spec 12 s3, simplified) ============ */
function planProduct(p,ctx){
  const out={slots:{},jobs:[],faceCut:false,productCut:false,cutKept:[]};
  if(p.kind!=='apparel')return out;
  const photos=p.photos;
  const uncut=r=>photos.filter(f=>f.role===r&&!f.cut).sort((a,b)=>a.n-b.n)[0];
  const cutOf=r=>photos.find(f=>f.role===r&&f.cut);
  const onModel=photos.some(f=>PERSON.has(f.role)||f.onModel);
  const hasFlat=photos.some(f=>f.role==='flat');
  const views=new Set(photos.map(f=>f.view||'front'));
  const memo={};
  const ladder=r=>{
    if(memo[r])return memo[r];let res;
    if(p.carried&&p.carried.role===r)res={path:'carried',refs:[1,2,5]};
    else if(p.cropFrom&&p.cropFrom[r]&&photos.some(f=>f.n===p.cropFrom[r]))res={path:'crop',parent:p.cropFrom[r]};
    else if(p.dept==='unknown')res={reason:'department_unset'};
    else if(!ctx.make)res={reason:ctx.makeReason};
    else if(r==='pk')res=p.pkOk?{path:'mode_a',refs:photos.map(f=>f.n)}:{reason:'no_pieces'};
    else if(PERSON.has(r)&&!onModel){
      if(rowKey(p)==='kids')res={reason:'no_parent'};
      else if(hasFlat&&ctx.modeB)res={path:'mode_b',refs:photos.filter(f=>f.role==='flat'||f.role==='fb').map(f=>f.n)};
      else if(hasFlat)res={reason:'no_brand_model'};
      else res={reason:'no_parent'};
    }
    else if(!views.has(BACK.has(r)?'back':'front'))res={reason:'no_view'};
    else if(photos.length<2)res={reason:'cannot_check'};
    else res={path:'mode_a',refs:photos.filter(f=>!f.cut).map(f=>f.n)};
    return memo[r]=res;
  };
  for(const ch of ctx.channels){
    out.slots[ch]=entriesFor(p,ch).map(e=>{
      const alts=Array.isArray(e)?e:[e];
      for(const a of alts){const f=uncut(a);if(f)return {e,role:a,state:'filled',n:f.n}}
      const occ=alts.map(cutOf).find(Boolean);
      let pick=null;for(const a of alts){const l=ladder(a);if(l.path){pick={a,l};break}}
      if(!pick)pick={a:alts[0],l:ladder(alts[0])};
      if(occ&&occ.cut==='head')out.faceCut=true;
      if(occ&&occ.cut==='product')out.productCut=true;
      return {e,role:pick.a,state:occ?'occupied_cut':'missing',occ:occ?occ.n:null,occCut:occ?occ.cut:null,via:pick.l};
    });
  }
  const jobs={};
  for(const ch of ctx.channels)for(const sl of out.slots[ch]){
    if(sl.state==='filled'||!sl.via.path)continue;
    const j=jobs[sl.role]||(jobs[sl.role]={role:sl.role,path:sl.via.path,parent:sl.via.parent||null,refs:sl.via.refs||null,retires:null,retireCut:null,retireChs:[]});
    if(sl.occ){j.retires=sl.occ;j.retireCut=sl.occCut;if(!j.retireChs.includes(ch))j.retireChs.push(ch)}
  }
  let list=Object.values(jobs);
  if(list.some(j=>j.path==='mode_b')){
    if(!jobs.fl)list.push({role:'fl',path:'mode_b',refs:photos.filter(f=>f.role==='flat').map(f=>f.n),retireChs:[]});
    list.forEach(j=>{if(j.path==='mode_b'){if(j.role==='fl')j.anchor=true;else j.waitAnchor=true}});
    list.sort((a,b)=>(b.anchor?1:0)-(a.anchor?1:0));
  }
  out.jobs=list;
  const req=new Set();for(const ch of ctx.channels)entriesFor(p,ch).flat().forEach(r=>req.add(r));
  photos.forEach(f=>{if(f.cut&&!req.has(f.role))out.cutKept.push(f.n)});
  return out;
}
function summary(b){
  const ctx=ctxFor(b);const res={apparel:0,missing:0,groups:{},faceCut:0,productCut:0,oneOnly:0,unknown:0,modeB:0,kids:0,gen:0,rows:[]};
  b.products.filter(p=>p.kind==='apparel').forEach(p=>{
    res.apparel++;const pl=planProduct(p,ctx);let miss=false;const seen={};
    for(const ch in pl.slots)pl.slots[ch].forEach(sl=>{
      if(sl.state==='filled')return;if(sl.via.path==='carried')return;miss=true;
      if(sl.state==='occupied_cut'&&sl.via.path)return;
      const g=GROUP[sl.role]||sl.role;const cat=sl.via.path==='crop'?'cut':sl.via.path?'made':'not';
      const order={cut:0,made:1,not:2};if(!seen[g]||order[cat]<order[seen[g]])seen[g]=cat;
    });
    for(const g in seen){const G=res.groups[g]||(res.groups[g]={n:0,cut:0,made:0,not:0});G.n++;G[seen[g]]++}
    if(miss)res.missing++;if(pl.faceCut)res.faceCut++;if(pl.productCut)res.productCut++;if(p.photos.length===1&&miss)res.oneOnly++;if(p.dept==='unknown')res.unknown++;
    if(pl.jobs.some(j=>j.path==='mode_b'))res.modeB++;if(rowKey(p)==='kids')res.kids++;
    const g=pl.jobs.filter(j=>j.path==='mode_a'||j.path==='mode_b').length;res.gen+=g;
    res.rows.push({p,pl,miss,gen:g});
  });
  return res;
}
const limitDefault=gen=>Math.max(1,Math.ceil(gen*30/100-1e-9));

/* ============ Scene eligibility (spec 13 s2.1) ============ */
function sceneElig(b,p,ignoreMode){
  if(p.kind==='apparel')return null;
  if(!ignoreMode&&b.sceneMode==='off')return {skip:'No scene image: scene images were switched off for this batch.',batchOff:true};
  const prof=approvedProfile(p.brand);
  const benchOk=S.makers.some(m=>m.enabled&&m.approved&&(m.uses.includes('scene_full')||m.uses.includes('scene_background')));
  if(!prof||!prof.enabled||!benchOk)return {skip:'No scene image: scene images are switched off for this brand.',brandOff:true};
  const scope=S.rights[p.brand]?S.rights[p.brand].scope:'none';
  if(scope==='none')return {skip:"No scene image: the brand's written permission for generated images is not on record.",brandOff:true,noRights:true};
  if(p.photos.some(f=>['worn','carried','scene'].includes(f.presence)))return {skip:"No scene image needed: the brand's photos already show it worn or in a scene.",worn:true};
  if(!p.sub||p.sub==='unknown')return {skip:'No scene image: the type of shoe or bag is not known yet.',unknownSub:true};
  const entry=prof.subcategories[p.sub]||{};
  const full=prof.routes.full&&scope==='worn_or_carried'&&(ignoreMode||b.sceneMode!=='still_life')&&!!entry.worn;
  const comp=prof.routes.composite;
  if(!full&&!comp)return {skip:'No scene image: the brand allows neither a worn scene nor a still life for this product.'};
  const route=full?(prof.routePreference==='composite_first'&&comp?'composite':'full'):'composite';
  return {route,full,comp,stillOnly:scope==='still_life'};
}
function sceneSum(b){
  const prods=b.products.filter(p=>p.kind!=='apparel');const r={n:prods.length,elig:0,worn:0,unknownSub:0,other:0,brandSkip:null,shoes:prods.some(p=>p.kind==='shoe'),bags:prods.some(p=>p.kind==='bag')};
  prods.forEach(p=>{const e=sceneElig(b,p,true);if(e.skip){if(e.brandOff)r.brandSkip=e;else if(e.worn)r.worn++;else if(e.unknownSub)r.unknownSub++;else r.other++}else r.elig++});
  return r;
}
function sceneOutcome(p,e){let route=e.route,attempts=1,hold=null;
  if(route==='full'){if(p.scene.hold==='face'){hold='face';attempts=4}else if(p.scene.fullFails){if(e.comp){route='composite';attempts=5}else{hold='scene_realism';attempts=4}}}
  if(route==='composite'&&p.scene.hold==='paste_back'){hold='paste_back_mismatch';attempts=6}
  return {route,attempts,hold}}

/* ============ Batch life cycle ============ */
function addJob(b,p,pj,state){
  const n=101+b.jobs.filter(j=>j.pid===p.id).length;
  const j=Object.assign({},pj,{id:b.id+'-'+p.id+'-'+pj.role+'-'+n,pid:p.id,state,n,labels:[],mk:0,wave:b.jobs.length%2});
  j.retireChs=(pj.retireChs||[]).slice();if(pj.refs)j.refs=pj.refs.slice();
  j.outcome=pj.path==='carried'?'references_changed':((p.outcomes&&p.outcomes[pj.role])||'pass');
  j.attempts=j.outcome==='pass'?(hash(j.id)%2?1:2):3;
  b.jobs.push(j);return j;
}
function addScene(b,p,e){const o=sceneOutcome(p,e);const n=101+b.jobs.filter(j=>j.pid===p.id).length;
  b.jobs.push({id:b.id+'-'+p.id+'-ls-'+n,pid:p.id,role:'ls',path:'scene',state:'planned',n,labels:[],mk:0,wave:b.jobs.length%2,route:o.route,attempts:o.attempts,hold:o.hold,answers:null,retireChs:[]})}
function startBatch(id){
  const b=B(id);const s4=summary(b);
  if(b.makeTicked&&s4.gen>0&&!detectFailed(b)&&!(b.limitTouched?b.limit:String(limitDefault(s4.gen)))){toast('Set a limit for made photos, or untick Make the missing shots.');return}
  if(!b.limitTouched)b.limit=String(limitDefault(s4.gen));
  b.detectFailed=detectFailed(b);b.status='running';b.startedAt=TODAY+' '+clock();b.jobs=[];b.sheets=[];b.finalized=false;b.updatedNotice=null;b.capRaised=false;
  const ctx=ctxFor(b);
  b.products.forEach(p=>{const pl=planProduct(p,ctx);pl.jobs.forEach(pj=>addJob(b,p,pj,pj.path==='carried'?'held':(pj.waitAnchor?'waiting':'planned')));const e=sceneElig(b,p);if(e&&!e.skip)addScene(b,p,e)});
  applySwitchEffects();save();go('#batch/'+id+'/products');toast('Started. Brand photos go live as soon as they are ready; made photos never hold them back.');
}
function sampled(j){return hash(j.id)%10===0}
function resolveCheck(b,j){
  if(j.path==='crop'){j.state=(j.retires&&(S.sw.phase.crops==='review_all'||sampled(j)))?'in_review':'ready';return}
  if(j.path==='scene'){if(j.hold)j.state='held';else j.state=(S.sw.phase['scene_'+j.route]==='review_all'||sampled(j))?'in_review':'ready';return}
  if(j.outcome!=='pass')j.state='held';else j.state=(S.sw.phase.made==='review_all'||j.anchor||sampled(j))?'in_review':'ready';
}
function capHit(b,j){if(!S.sw.capOut||b.capRaised)return false;return b.jobs.filter(x=>x!==j&&(x.path==='mode_a'||x.path==='mode_b')&&!['planned','making','waiting','dropped'].includes(x.state)&&x.reason!=='cap').length>=4}
function advanceBatch(b){
  const before=b.jobs.map(j=>j.state);const liveNow=[];const steps=new Set();
  b.jobs.forEach((j,i)=>{const s=before[i];
    if(s==='ready'){j.state='live';liveNow.push(j);steps.add('publish')}
    else if(s==='checking'){resolveCheck(b,j);steps.add('check')}
    else if(s==='making'){if(j.mk>=j.wave){if((j.path==='mode_a'||j.path==='mode_b')&&capHit(b,j)){j.state='not_made';j.reason='cap'}else j.state='checking'}else j.mk++;steps.add('make')}
    else if(s==='planned'){j.state=j.path==='crop'?'checking':'making';steps.add('make')}
  });
  applySwitchEffects();
  const busy=b.jobs.some(j=>['planned','making','checking','ready'].includes(j.state));
  if(!busy&&!b.finalized){b.finalized=true;snapshot(b,'When the batch finished');steps.add('publish')}
  else if(liveNow.length&&b.finalized){snapshot(b,'After review');b.updatedNotice=TODAY}
  b.lastSteps=[...steps];
  return steps;
}
function fastForward(b){for(let i=0;i<12;i++){if(!b.jobs.some(j=>['planned','making','checking','ready'].includes(j.state))&&b.finalized)break;advanceBatch(b)}}
function applySwitchEffects(){
  for(const id in S.batches){const b=S.batches[id];if(b.status!=='running')continue;
    if(S.sw.newer){b.jobs.forEach(j=>{if((j.pid==='A03'||j.pid==='B01'||j.pid==='C01')&&['in_review','held'].includes(j.state)){j.state='not_made';j.reason='superseded';b.supersededNote=true}})}
  }
}
function snapshot(b,label){
  const v=b.sheets.length+1;const rows=b.products.map(p=>sheetRow(b,p,v));
  b.sheets.push({v,label,at:TODAY+' '+clock(),rows});
  b.jobs.forEach(j=>{if(j.state==='live'&&!j.inV)j.inV=v});
  b.products.forEach(p=>p.photos.forEach(f=>{if(f.newV===v)f.inV=v}));
}
function batchState(b){
  if(b.status==='draft')return {txt:'Not started (step '+(b.step||1)+')',cls:''};
  if(b.status==='done')return {txt:'Ready to download',cls:'ok'};
  const att=attentionJobs(b).length;
  if(b.jobs.some(j=>['planned','making','checking','ready'].includes(j.state)))return {txt:'Processing',cls:'run'};
  if(att)return {txt:'Needs attention ('+att+')',cls:'warn'};
  return {txt:'Ready to download',cls:'ok'};
}
function attentionJobs(b){return b.jobs.filter(j=>['in_review','held'].includes(j.state))}
function reconcile(b,p){
  if(b.status!=='running')return '';
  const pl=planProduct(p,ctxFor(b));let added=0,dropped=0;
  pl.jobs.forEach(pj=>{const ex=b.jobs.find(j=>j.pid===p.id&&j.role===pj.role&&!['not_made','dropped','replaced'].includes(j.state));if(!ex){addJob(b,p,pj,pj.waitAnchor?'waiting':'planned');added++}});
  b.jobs.filter(j=>j.pid===p.id&&j.path!=='scene').forEach(j=>{if(['not_made','dropped','replaced'].includes(j.state))return;
    if(!pl.jobs.some(pj=>pj.role===j.role)){const filler=p.photos.find(f=>f.role===j.role&&!f.cut);j.state='dropped';j.byBrand=filler?filler.n:null;dropped++}});
  return (added?added+' new '+plural(added,'shot','shots')+' planned. ':'')+(dropped?dropped+' made '+plural(dropped,'photo is','photos are')+' no longer needed. ':'');
}

/* ============ Links sheet ============ */
function liveItems(b,p,ch){
  const items=[];
  p.photos.forEach(f=>{if(b.jobs.some(j=>j.pid===p.id&&j.state==='live'&&j.retires===f.n&&j.retireChs.includes(ch)))return;items.push({n:f.n,role:f.role,kind:'brand',cut:f.cut})});
  b.jobs.filter(j=>j.pid===p.id&&j.state==='live'&&j.path!=='scene').forEach(j=>items.push({n:j.n,role:j.role,kind:j.path==='crop'?'derived':'generated',parent:j.parent}));
  const used=new Set(),order=[],missing=[];const rank=x=>({brand:0,derived:1,generated:2}[x.kind]*1000+x.n);
  if(p.kind==='apparel')entriesFor(p,ch).forEach(e=>{const alts=Array.isArray(e)?e:[e];for(const a of alts){const c=items.filter(it=>it.role===a&&!it.cut&&!used.has(it)).sort((x,y)=>rank(x)-rank(y))[0];if(c){used.add(c);order.push(c);return}}missing.push(e)});
  items.filter(it=>!used.has(it)).sort((x,y)=>x.n-y.n).forEach(it=>order.push(it));
  const ls=b.jobs.find(j=>j.pid===p.id&&j.path==='scene'&&j.state==='live');
  let sceneWhy=null;
  if(ls){const r=sceneChannel(b,p,ch,order.length);if(r.ok)order.push({n:ls.n,role:'ls',kind:'generated',route:ls.route});else sceneWhy=r.why}
  return {order,missing,sceneWhy};
}
function sceneChannel(b,p,ch,count){
  if(S.rights[p.brand].scope==='none')return {ok:false,why:"Not added: the brand's written permission for generated images is not on record."};
  if(S.chScene[ch].life==='off'||(S.sw.noScene&&ch==='namshi'))return {ok:false,why:'Not added: this marketplace does not take scene images.'};
  const max=S.chScene[ch].max;
  if((S.sw.trendyolFull&&ch==='trendyol')||(max&&count+1>max))return {ok:false,why:'Not added: this marketplace already has its maximum number of photos.'};
  return {ok:true,pos:count+1};
}
function notesFor(b,p){
  const N=[];
  if(p.kind==='apparel'){
    const pl=planProduct(p,ctxFor(b));
    for(const ch of b.channels)(pl.slots[ch]||[]).forEach(sl=>{
      if(sl.state==='filled')return;
      const j=b.jobs.find(x=>x.pid===p.id&&x.role===sl.role&&x.state!=='dropped');
      let reason=null;
      if(b.status==='done')reason='not_active';
      else if(j){if(j.state==='not_made')reason=j.reason;else return}
      else reason=sl.via.reason;
      if(!reason)return;
      N.push(notMade(reason,ch,sl.role,p));
      if(sl.state==='occupied_cut')N.push(`Photo ${sl.occ} is still used: no replacement could be made.`);
    });
    b.jobs.filter(j=>j.pid===p.id&&j.state==='live'&&j.retires).forEach(j=>j.retireChs.forEach(ch=>N.push(`Photo ${j.retires} was replaced on ${CH[ch]} because ${j.retireCut==='head'?'the face was cut at the top edge':'the product was cut at the frame edge'}.`)));
    pl.cutKept.forEach(n=>N.push(`Photo ${n} is still used: it is cut at the edge and no shot type the channel asks for replaces it.`));
    b.jobs.filter(j=>j.pid===p.id&&j.state==='dropped'&&j.byBrand&&j.inV).forEach(j=>N.push(`Photo ${j.n} was replaced by the brand's own photo ${j.byBrand}.`));
  }else{
    const e=sceneElig(b,p);const j=b.jobs.find(x=>x.pid===p.id&&x.path==='scene'&&x.state!=='dropped');
    if(!j){if(e&&e.skip)N.push(e.skip)}
    else if(j.state==='live')b.channels.forEach(ch=>{const L=liveItems(b,p,ch);if(L.sceneWhy)N.push(`${CH[ch]}: ${L.sceneWhy}`);else N.push(`${CH[ch]} img ${L.order.length}: ${j.route==='composite'?"The brand's own product photo placed in an AI-made scene.":"Scene image made by AI from the brand's photos."}`)});
    else if(j.state==='not_made')N.push(j.reason==='superseded'?'Scene image not used: a newer delivery of this product replaced this one.':'No scene image: a reviewer chose not to use it.');
    else if(j.state==='replaced')N.push("Generated scene image removed: the brand's own worn photo replaced it.");
    else if(b.status==='running')N.push('Brand photos are live; the scene image waits for review.');
  }
  return [...new Set(N)];
}
function sheetRow(b,p,v){
  const jobsP=b.jobs.filter(j=>j.pid===p.id);
  const pending=jobsP.some(j=>PENDING.includes(j.state));
  const fresh=jobsP.filter(j=>j.state==='live'&&!j.inV);
  const freshBrand=p.photos.some(f=>f.newV===v);
  let change;
  if(pending)change='pending_review';
  else if(fresh.some(j=>j.retires))change='cut_replaced';
  else if(fresh.some(j=>j.path!=='scene'))change='role_added';
  else if(fresh.some(j=>j.path==='scene'))change='scene_added';
  else if(freshBrand)change='updated';
  else change=(v===1&&b.kind!=='upload')?'new':'unchanged';
  if(v===1&&b.kind!=='upload'&&!pending)change='new';
  const ch={};
  b.channels.forEach(c=>{const L=liveItems(b,p,c);
    ch[c]={links:L.order.map(it=>`.../${c}/${p.key}_${it.n}.jpg`),
      shots:L.order.map((it,i)=>`${i+1} ${roleWord(it.role,p)}${it.kind==='derived'?` (cut from photo ${it.parent})`:it.kind==='generated'?' (made)':''}`).join(', '),
      missing:L.missing.map(e=>entryWords(e,p)).join(', '),
      ai:L.order.map((it,i)=>it.kind==='generated'?`${i+1} yes`:null).filter(Boolean).join(', ')}});
  return {key:p.key,name:p.name,brand:BRANDS[p.brand],ch,status:'ok',change,notes:notesFor(b,p)};
}

const VB={fl:'-25 0 150 200',bl:'-25 0 150 200',fm:'9.5 4 81 108',fmk:'-1 4 102 136',hs:'29 5 42 56',bh:'14 4 72 96',fw:'5 80 90 120',bw:'5 80 90 120',dt:'38.75 80 22.5 30',other:'-15 0 150 200',headcut:'9.5 19 81 108',prodcut:'38 18 75 100'};
const FLATVB={top:'14 18 72 96',dress:'-6 30 112 150',trousers:'12.5 88 75 100',bra:'20 30 60 80',swim:'20 28 60 80'};
function garment(o){

  if(base==='top')s+=top;

function route(){return (location.hash||'#home').slice(1).split('/')}

let detTimer=null;
function render(){
  if(detTimer){clearInterval(detTimer);detTimer=null}
  document.documentElement.dataset.theme=S.theme||'';if(!S.theme)document.documentElement.removeAttribute('data-theme');
  $('#seat').value=S.seat;
  const r=route();
  $('#nav').innerHTML=`<a href="#home" class="${r[0]!=='admin'?'on':''}">Catalog images</a>`+(S.seat==='admin'?`<a href="#admin/models" class="${r[0]==='admin'?'on':''}">Admin</a>`:'');
  let h='';
  try{
    if(r[0]==='home'||r[0]==='')h=vHome();
    else if(r[0]==='new')h=vWizard(+r[1]||1);
    else if(r[0]==='batch')h=vBatch(r[1],r[2]);
    else if(r[0]==='product')h=vProduct(r[1],r[2]);
    else if(r[0]==='admin')h=vAdmin(r[1]||'models');

function tSheet(b){
  if(b.status==='done'&&!b.sheets.length)snapshot(b,'Final');
  if(!b.sheets.length)return `<div class="card"><h3>No links sheet yet</h3><p class="muted">The first version is written when the batch finishes. Press Advance time until the banner says the brand photos and made photos are done.</p></div>`;
  const v=Math.min(S.sheetV[b.id]||b.sheets.length,b.sheets.length);const sh=b.sheets[v-1];
  const chs=S.sheetCh==='all'?b.channels:S.sheetCh==='two'?b.channels.slice(0,2):[S.sheetCh].filter(c=>b.channels.includes(c));
  const useChs=chs.length?chs:b.channels.slice(0,2);
  const maxImg={};useChs.forEach(c=>maxImg[c]=Math.max(1,...sh.rows.map(r=>r.ch[c]?r.ch[c].links.length:0)));
  const hasAI=c=>S.chScene[c].ai==='xmp_and_sheet';
  const head1=useChs.map(c=>`<th colspan="${maxImg[c]+2+(hasAI(c)?1:0)}" class="merged">${CH[c]}</th>`).join('');
  const head2=useChs.map(c=>Array.from({length:maxImg[c]},(_,i)=>`<th>Image ${i+1}</th>`).join('')+`<th>${CH[c]} shots</th><th>${CH[c]} missing</th>${hasAI(c)?`<th>${CH[c]} AI-made</th>`:''}`).join('');
  const body=sh.rows.map(r=>`<tr><td>${r.brand}</td><td>${r.key}</td>${useChs.map(c=>{const x=r.ch[c]||{links:[]};return Array.from({length:maxImg[c]},(_,i)=>`<td>${x.links[i]?`<a href="#" onclick="return false">${esc(x.links[i])}</a>`:''}</td>`).join('')+`<td class="wrap">${esc(x.shots||'')}</td><td class="wrap">${esc(x.missing||'')}</td>${hasAI(c)?`<td>${esc(x.ai||'')}</td>`:''}`}).join('')}<td>${r.status}</td><td><b>${r.change}</b></td><td class="notes">${r.notes.map(esc).join('<br>')}</td></tr>`).join('');
  const resub=sh.rows.filter(r=>['role_added','cut_replaced','scene_added','updated'].includes(r.change));
  return `<p class="lead">One row per product. Each marketplace has its own set of links, then the shots it has and the shots still missing. This is a preview of the Excel file.</p>
  <div class="inline-sel" style="margin-bottom:10px"><label>Version <select onchange="S.sheetV['${b.id}']=+this.value;render()">${b.sheets.map(s=>`<option value="${s.v}" ${s.v===v?'selected':''}>Version ${s.v}: ${s.label} (${s.at})</option>`).join('')}</select></label>
  <label>Marketplaces <select onchange="S.sheetCh=this.value;render()"><option value="two" ${S.sheetCh==='two'?'selected':''}>First two</option><option value="all" ${S.sheetCh==='all'?'selected':''}>All ticked</option>${b.channels.map(c=>`<option value="${c}" ${S.sheetCh===c?'selected':''}>${CH[c]} only</option>`).join('')}</select></label></div>
  ${b.updatedNotice&&v<b.sheets.length?`<div class="notice">You are looking at an older version. The links sheet was updated after review on ${b.updatedNotice}. Download it again.</div>`:''}
  <div class="notice ${resub.length?'':'ok'}">${resub.length?`<b>To re-submit in this version:</b> ${resub.map(r=>`${r.key} (${r.change})`).join(', ')}. Each on the marketplaces named in its notes, as for "updated" today.`:'Nothing to re-submit in this version.'}</div>
  <div class="tw sheet"><table><thead><tr><th rowspan="2">brand</th><th rowspan="2">identifier</th>${head1}<th rowspan="2">status</th><th rowspan="2">change</th><th rowspan="2">notes</th></tr><tr>${head2}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="acts" style="margin-top:14px"><button class="btn primary" onclick="toast('Prototype: the Excel file is not generated. The table above is what it holds.')">Download links sheet (Excel)</button><button class="btn ghost" onclick="toast('Prototype: CSV not generated.')">Download CSV</button></div>
  <div class="card" style="margin-top:16px"><h3>What the change column means</h3><div class="legend">${Object.entries(CHANGE_MEANING).map(([k,m])=>`<div><span class="mono">${k}</span><span>${esc(m)}</span></div>`).join('')}</div></div>`;
}

/* ============ Product page ============ */
function vProduct(bid,pid){
  const b=B(bid);const p=b&&b.products.find(x=>x.id===pid);if(!p)return `<p>Product not found. <a href="#home">All batches</a></p>`;
  const locked=b.status==='running'&&b.jobs.some(j=>j.pid===p.id&&['planned','making','checking','ready'].includes(j.state));
  const photos=p.photos.map(f=>`<figure>${photoImg(p,f)}<figcaption><b>Photo ${f.n}</b>: ${p.kind==='apparel'?roleWord(f.role,p):(f.presence==='packshot'?'packshot, '+f.view:f.presence)}${f.note?` (${esc(f.note)})`:''}<br>${f.cut?`<span class="badge cut">${f.cut==='head'?'Face cut at the top edge':'Product cut at the frame edge'}</span><br>`:''}${p.kind==='apparel'?`<label class="sm">Change shot type <select onchange="setRole('${bid}','${pid}',${f.n},this.value)">${ROLE_OPTS.map(r=>`<option value="${r}" ${(f.role||'none')===r?'selected':''}>${ROLE_WORDS[r]}</option>`).join('')}</select></label>`:''}</figcaption></figure>`).join('');
  const made=b.jobs.filter(j=>j.pid===p.id&&!['dropped'].includes(j.state)).map(j=>`<figure>${jobImg(p,j)}<figcaption><b>Photo ${j.n}</b>: ${roleWord(j.role,p)}<br>${j.path==='crop'?`<span class="badge crop">Cut from photo ${j.parent}</span>`:j.path==='scene'?`<span class="badge made">${j.route==='composite'?'still life, made':'made'}</span>`:`<span class="badge made">made</span>`}<br><span class="sm muted">${jobWord(j)}</span></figcaption></figure>`).join('');
  const notes=notesFor(b,p);
  const order=b.channels.map(ch=>{const L=liveItems(b,p,ch);return `<div class="chrow"><b>${CH[ch]}</b><div class="sm">${L.order.map((it,i)=>`${i+1} ${roleWord(it.role,p)}${it.kind==='derived'?' (cut)':it.kind==='generated'?' (made)':''}`).join(', ')}${L.missing.length?`<br><span style="color:var(--bad)">Missing: ${L.missing.map(e=>entryWords(e,p)).join(', ')}</span>`:''}${L.sceneWhy?`<br><span class="muted">${L.sceneWhy}</span>`:''}</div></div>`}).join('');
  return `<div class="hdr"><div><a href="#batch/${bid}/products" class="sm">${esc(b.name)}</a><h1>${p.key}</h1><p class="lead">${esc(p.name)} . ${BRANDS[p.brand]} . ${p.kind==='apparel'?(GARMENT_WORD[p.dept]||''):SUBS[p.sub]} . ${p.audience}</p></div>
  <div class="acts"><button class="btn ghost" onclick="toast('Prototype: download not built.')">Download photos</button>${locked?'<span class="pill run">Locked by a running batch</span>':`<button class="btn primary" onclick="uploadPhotos('${bid}','${pid}')">Upload photos</button>`}</div></div>
  ${p.scenario?`<div class="protobox"><span class="pbadge">Sample scenario</span> ${esc(p.scenario)}</div>`:''}
  ${p.kind==='apparel'?`<div class="card">${garmentSelect(b,p)}<p class="help">Changing the garment type or a photo's shot type runs the plan again for this product.</p></div>`:''}
  <h2 style="margin:20px 0 10px">Brand photos</h2><div class="thumbs">${photos}</div>
  ${made?`<h2 style="margin:20px 0 10px">Made photos</h2><div class="thumbs">${made}</div>`:''}
  <h2 style="margin:20px 0 10px">Order per marketplace</h2><div class="card">${order}</div>
  <h2 style="margin:20px 0 10px">Notes</h2><div class="card">${notes.length?`<ul class="lines">${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'<p class="muted">No notes.</p>'}</div>`;
}
function jobWord(j){return {planned:'Planned',making:'Being made',checking:'Being checked',in_review:'Waiting for review',held:'Held: needs review',waiting:'Waits for the first full-length photo',ready:'Approved, publishing',live:'Live',not_made:'Not made',replaced:'Replaced by a real photo'}[j.state]||j.state}
function setRole(bid,pid,n,v){const b=B(bid);const p=b.products.find(x=>x.id===pid);const f=p.photos.find(x=>x.n===n);const before=summary(b);f.role=v==='none'?null:v;f.roleBy='operator';f.view=BACK.has(v)?'back':f.view;
  const msg=reconcile(b,p);const after=summary(b);render();toast(`Photo ${n} is now "${ROLE_WORDS[v]}". The plan for ${p.key} was run again. ${b.status==='draft'?`Made photos planned in this batch: ${before.gen} to ${after.gen}.`:(msg||'Nothing else changes.')}`)}
function uploadPhotos(bid,pid){const src=B(bid).products.find(x=>x.id===pid);const p=clone(src);const id='U'+Object.keys(S.batches).filter(k=>k[0]==='U').length+'-'+src.id;p.id=id+'P';
  const chs=B(bid).channels.slice();
  const b=mkBatch(id,`${p.key} photos ${TODAY}`,p.brand,chs,[p],'Today');b.kind='upload';b.channels=chs;b.step=1;
  S.batches[id]=b;S.wiz.bid=id;go('#new/1')}

/* ============ Admin ============ */
function vAdmin(page){
  if(S.seat!=='admin')return `<div class="card"><h2>Only admins see this page.</h2><p class="muted">Switch "You are" to Admin in the top bar.</p></div>`;
  const pages=[['models','Brand models'],['scene','Scene style profile'],['rights','Brand permissions'],['makers','Photo makers'],['ops','Ops']];
  const nav=`<div class="subnav">${pages.map(([k,l])=>`<a href="#admin/${k}" class="${page===k?'on':''}">${l}</a>`).join('')}</div>`;
  const body={models:aModels,scene:aScene,rights:aRights,makers:aMakers,ops:aOps}[page]||aModels;
  return `<h1>Admin</h1>${nav}${body()}`;
}
function aModels(){
  const brand=S.open.regBrand||'vero_moda';const R=S.registry[brand];
  const sel=`<label class="inline-sel">Brand <select onchange="S.open.regBrand=this.value;render()">${Object.keys(BRANDS).map(k=>`<option value="${k}" ${k===brand?'selected':''}>${BRANDS[k]}</option>`).join('')}</select></label>`;
  if(R.deleted||!R.groups.length&&!R.pack)return `${sel}<div class="card" style="margin-top:14px"><h3>No model photos for ${BRANDS[brand]}</h3><p class="muted">${R.deleted?'This brand\'s model data was deleted on '+TODAY+'. Published product images stay.':'No photos of this brand\'s models have been collected yet.'}</p>${R.deleted?`<button class="btn" onclick="restoreReg('${brand}')">Prototype: collect photos again</button>`:''}</div>`;
  const contact=Array.from({length:12},(_,i)=>{const roles=['fl','hs','bh','fm'];const r=roles[i%4];return `<figure>${apparelImg({g:i%3===1?'dress':'top',color:['#e8dcc4','#9cc3e4','#b5562f','#24305e'][i%4],length:'short'},r,{hair:R.groups[i%3]?R.groups[i%3].hair:'#3b2b22'})}<figcaption>${ROLE_WORDS[r]}, light background</figcaption></figure>`}).join('');
  const groups=R.groups.map((g,gi)=>`<div class="prow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${g.status==='confirmed'?(g.label||`${BRANDS[brand]} model ${String.fromCharCode(65+gi)}`):'Group '+(gi+1)}</b> <span class="muted sm">${g.size} photos</span> <span class="pill ${g.status==='confirmed'?'ok':g.status==='rejected'?'bad':''}">${{candidate:'To confirm',confirmed:'Same person, confirmed',rejected:'Not usable'}[g.status]}</span><div class="faces" style="margin-top:8px">${Array.from({length:Math.min(g.size,8)},(_,i)=>faceSVG(g.mixed&&i%2?'#a8743a':g.hair,i+gi)).join('')}</div>${g.mixed?'<p class="help">These may be two people. Use Split if so.</p>':''}</div>
  <div class="acts">${g.status==='candidate'?`<button class="btn ok sm" onclick="grp('${brand}',${gi},'same')">Same person</button><button class="btn ghost sm" onclick="grp('${brand}',${gi},'split')">Split</button><button class="btn ghost sm" onclick="grp('${brand}',${gi},'bad')">Not usable</button>`:''}</div></div>`).join('');
  const confirmed=R.groups.some(g=>g.status==='confirmed');
  const packTiles=['fl','hs','bh','fm'].map(r=>`<figure>${apparelImg({g:'top',color:'#d6d1c4',length:'short'},r,{hair:(R.groups[0]||{}).hair})}<figcaption>${ROLE_WORDS[r]}${r==='fl'?' with face':''}<br><span class="sm muted">2,400 px, light grey, permission on record</span></figcaption></figure>`).join('');
  return `${sel}<p class="lead">Only admins see these pages. Faces are grouped within this brand only and never shown anywhere else. No child ever enters this list.</p>
  <h2 style="margin:18px 0 8px">Contact sheet</h2><p class="muted sm">Usable photos of the brand's own adult models, tagged by shot type.</p><div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">${contact}</div>
  <h2 style="margin:22px 0 8px">Person groups</h2><div class="plist">${groups}</div>
  <h2 style="margin:22px 0 8px">Model pack</h2><div class="card"><p>One pack per person: full length front with face, head and shoulders, back to the hips, and front to mid-thigh if there is one.</p><div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${packTiles}</div>
  ${R.pack==='approved'?`<div class="notice ok" style="margin-top:12px"><b>${R.packLabel}: approved</b> by Admin for ${R.packDepts.map(d=>GARMENT_WORD[d]).join(', ')}. An approved pack is never edited; a change is a new version. <button class="btn ghost sm" onclick="S.registry['${brand}'].pack='candidate';render();toast('Prototype: pack set back to not approved.')">Prototype: un-approve</button></div>`:`<p class="help">Approve the pack for these garment types:</p><div class="chips">${['tops','dresses_jumpsuits','bottoms','outerwear'].map(d=>`<label class="chip"><input type="checkbox" checked class="pdept" value="${d}"> ${GARMENT_WORD[d]}</label>`).join('')}</div><div class="acts" style="margin-top:10px"><button class="btn primary" ${confirmed?'':'disabled'} onclick="approvePack('${brand}')">Approve</button>${confirmed?'':'<span class="help">Confirm a person group first (Same person).</span>'}</div>`}</div>
  <h2 style="margin:22px 0 8px">Delete face data</h2><div class="card" style="border-color:var(--bad)"><p>Deletes this brand's face data, person groups, model packs and model photos. Published product images are not affected. Only after the owner's typed yes.</p><button class="btn danger" onclick="delReg('${brand}')">Delete this brand's model data</button></div>`;
}
function grp(brand,gi,act){const R=S.registry[brand];const g=R.groups[gi];
  if(act==='same'){g.status='confirmed';g.label=`${BRANDS[brand]} model ${String.fromCharCode(65+R.groups.filter(x=>x.status==='confirmed').length-1)}`;toast(`Confirmed as ${g.label}. It can now become a model pack.`)}
  if(act==='bad'){g.status='rejected';toast('Marked not usable.')}
  if(act==='split'){const half=Math.floor(g.size/2);R.groups.splice(gi+1,0,{id:g.id+'b',size:g.size-half,hair:'#a8743a',status:'candidate'});g.size=half;g.mixed=false;toast('Split into two groups.')}
  render()}
function approvePack(brand){const R=S.registry[brand];R.pack='approved';R.packLabel=(R.groups.find(g=>g.status==='confirmed')||{}).label||BRANDS[brand]+' model A';R.packDepts=[...document.querySelectorAll('.pdept')].filter(x=>x.checked).map(x=>x.value);R.deleted=false;render();toast(`${R.packLabel} approved. Flat-lay-only products of ${BRANDS[brand]} can now be made on this model.`)}
function delReg(brand){const word='DELETE '+BRANDS[brand].toUpperCase();modal(`<h3>Delete this brand's model data</h3><p>This deletes every face record, person group, model pack and model photo of ${BRANDS[brand]}. It cannot be undone. Published product images stay.</p><p>Only do this after the owner's typed yes. Type <b class="mono">${word}</b> to confirm.</p><input type="text" id="delw" class="full" oninput="document.getElementById('delgo').disabled=this.value!=='${word}'" autocomplete="off"><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="delgo" disabled onclick="doDel('${brand}')">Delete</button></div>`)}
function doDel(brand){const R=S.registry[brand];const n=R.groups.length,ph=R.groups.reduce((a,g)=>a+g.size,0);R.groups=[];R.pack=null;R.deleted=true;closeModal();render();toast(`Deleted: ${n} groups, ${ph} photos, 1 model pack. Recorded with counts only.`)}
function restoreReg(brand){S.registry[brand]=clone(defaultState().registry[brand]);S.registry[brand].pack='candidate';render()}
function aScene(){
  const brand=S.open.profBrand||'us_polo';const P=S.profiles[brand];const ap=approvedProfile(brand);const d=P.draft;
  const sel=`<label class="inline-sel">Brand <select onchange="S.open.profBrand=this.value;render()">${Object.keys(BRANDS).map(k=>`<option value="${k}" ${k===brand?'selected':''}>${BRANDS[k]}</option>`).join('')}</select></label>`;
  const status=ap?`<span class="pill ok">Approved version ${P.versions.length}</span> <span class="muted sm">by ${P.versions[P.versions.length-1].by}, ${P.versions[P.versions.length-1].at}</span>`:'<span class="pill">No approved profile: scene images are off for this brand</span>';
  let h=`${sel}<p style="margin-top:10px">${status}</p><p class="lead">How scene images look for this brand: the scene per type of shoe or bag, the styling for each audience, and whose face may show. A draft is used only once approved.</p>`;
  if(!d)return h+`<div class="acts"><button class="btn primary" onclick="startDraft('${brand}',true)">Start from the default</button>${ap?`<button class="btn ghost" onclick="startDraft('${brand}',false)">Edit the approved version</button>`:''}</div>`;
  const models=S.registry[brand]&&S.registry[brand].pack==='approved'&&!S.registry[brand].deleted?[S.registry[brand].packLabel]:[];
  const warn=[];Object.entries(d.subcategories).forEach(([k,e])=>{if(!e.worn)warn.push(`${SUBS[k]}: no worn scene. Only a still life will be made.`)});
  if(!d.routes.full&&!d.routes.composite)warn.push('Neither route is on: no scene images will be made.');
  ['men','women','unisex'].forEach(a=>{if(d.person[a]!=='never'&&!S.rights[brand].likeness)warn.push(`${a}: a face needs the brand's permission for its model's likeness, which is not on record.`)});
  const subRows=Object.entries(d.subcategories).map(([k,e])=>`<tr><td><b>${SUBS[k]}</b></td><td><input type="text" value="${esc(e.worn||'')}" placeholder="No worn scene" onchange="setSub('${brand}','${k}','worn',this.value)" style="min-width:200px"></td><td><select onchange="setSub('${brand}','${k}','framing',this.value)">${Object.entries(FRAMINGS).map(([f,l])=>`<option value="${f}" ${e.framing===f?'selected':''}>${l}</option>`).join('')}</select></td><td><input type="text" value="${esc(e.stillLife)}" onchange="setSub('${brand}','${k}','stillLife',this.value)" style="min-width:160px"></td><td class="sm">${esc(e.styling.men)}<br>${esc(e.styling.women)}</td></tr>`).join('');
  const face=a=>`<div class="sw" style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin:4px 0"><span>${a==='unisex'?'Unisex':a[0].toUpperCase()+a.slice(1)}</span><select onchange="S.profiles['${brand}'].draft.person['${a}']=this.value;render()"><option value="never">Nobody (legs only)</option>${models.length?models.map(m=>`<option value="${m}" ${d.person[a]===m?'selected':''}>${m}</option>`).join(''):'<option disabled>No approved brand model yet</option>'}</select></div>`;
  h+=`<div class="card"><h3>Draft</h3>
  <label class="opt"><input type="checkbox" ${d.enabled?'checked':''} onchange="S.profiles['${brand}'].draft.enabled=this.checked;render()"><span>Scene images on for this brand</span></label>
  <label class="opt"><input type="checkbox" ${d.routes.full?'checked':''} onchange="S.profiles['${brand}'].draft.routes.full=this.checked;render()"><span>Worn or carried scene<small>Drawn by AI from every usable photo of the product.</small></span></label>
  <label class="opt"><input type="checkbox" ${d.routes.composite?'checked':''} onchange="S.profiles['${brand}'].draft.routes.composite=this.checked;render()"><span>Still life<small>The brand's real cut-out placed in an AI-made scene; product pixels unchanged.</small></span></label>
  <div class="inline-sel" style="margin:8px 0"><label>Try first <select onchange="S.profiles['${brand}'].draft.routePreference=this.value"><option value="full_first" ${d.routePreference==='full_first'?'selected':''}>Worn scene, still life if it fails</option><option value="composite_first" ${d.routePreference==='composite_first'?'selected':''}>Still life, worn scene if it fails</option></select></label><label>Unisex products styled as <select onchange="S.profiles['${brand}'].draft.unisexStyling=this.value"><option value="men" ${d.unisexStyling==='men'?'selected':''}>Men</option><option value="women" ${d.unisexStyling==='women'?'selected':''}>Women</option></select></label></div>
  <h4 style="margin-top:14px">Scenes per type</h4><div class="tw"><table><thead><tr><th>Type</th><th>Worn scene</th><th>Framing</th><th>Still life</th><th>Styling (men / women)</th></tr></thead><tbody>${subRows}</tbody></table></div>
  <h4 style="margin-top:14px">Never in a scene</h4><textarea onchange="S.profiles['${brand}'].draft.forbidden=this.value.split('\\n').filter(Boolean)">${esc(d.forbidden.join('\n'))}</textarea>
  <h4 style="margin-top:14px">Kids</h4><div class="card" style="background:var(--soft)"><ul class="lines sm"><li>No child is ever drawn as a person: shoes are legs only or feet only, bags held at the waist, no face, head or body above the knee or waist, one child and no adult in the frame.</li><li>Knees covered except at a pool or beach (then the frame stops below the knee); torso covered; no swimwear or underwear; everyday standing, walking or sitting only.</li><li>Also never: ${esc(d.kidsForbidden.join(', ').toLowerCase())}.</li><li>Products we cannot place by audience are treated as kids.</li></ul><p class="help">These rules are fixed and cannot be edited.</p></div>
  <h4 style="margin-top:14px">Show the face of</h4>${face('men')}${face('women')}${face('unisex')}
  <div class="sw" style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin:4px 0"><span>Kids</span><select disabled><option>Nobody (legs only)</option></select></div><p class="help">Children are never shown with a face, and the model list holds no child models and no child face data. This cannot be changed.</p>
  ${warn.length?`<div class="notice"><b>Before you approve:</b><ul class="lines">${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
  <div class="row-acts"><button class="btn ghost" onclick="S.profiles['${brand}'].draft=null;render()">Discard draft</button><button class="btn primary" onclick="approveProfile('${brand}')">Approve this version</button></div></div>`;
  if(P.versions.length)h+=`<h3 style="margin-top:18px">Versions</h3><ul class="lines">${P.versions.map(v=>`<li>Version ${v.v}, approved by ${v.by}, ${v.at}${v.body.enabled?'':' (scene images off)'}</li>`).join('')}</ul>`;
  return h;
}
function startDraft(brand,fromDefault){const P=S.profiles[brand];P.draft=fromDefault?defaultSceneBody():clone(approvedProfile(brand));render()}
function setSub(brand,k,f,v){S.profiles[brand].draft.subcategories[k][f]=v||(f==='worn'?null:v);render()}
function approveProfile(brand){const P=S.profiles[brand];const d=P.draft;if(!d.forbidden.length){toast('The forbidden list cannot be empty.');return}P.versions.push({v:P.versions.length+1,by:'Admin',at:TODAY,body:d});P.draft=null;render();toast(`Version ${P.versions.length} approved. New batches of ${BRANDS[brand]} use it.`)}

const FEEL=['Where did you hesitate?',"Any word you didn't understand?",'Anywhere you wanted an undo?','Does two-person review feel heavy?','Do "made" photos feel trustworthy from the card alone?'];
function vGuide(){
  const done=SCEN.filter(s=>s[2]&&S.guide[s[0]]).length;
  return `<div class="hdr" style="margin:0"><h2>Test guide</h2><button class="btn ghost sm" onclick="closeDrawer()">Close</button></div><p class="sm muted">${done} of 30 ticked. "Take me there" sets up the scenario and opens the right screen. Ticks are kept in this browser only.</p>
  ${SCEN.map(s=>s[2]?`<div class="guide-item"><input type="checkbox" ${S.guide[s[0]]?'checked':''} onchange="S.guide['${s[0]}']=this.checked;save();renderDrawer()" aria-label="Done ${s[0]}"><div><span class="gid">${s[0].slice(1)}.</span>${esc(s[1])}<br><button class="link sm" onclick="takeMe('${s[0]}')">Take me there</button></div></div>`:`<h3 style="margin-top:16px">${s[1]}</h3>`).join('')}
  <h3 style="margin-top:18px">Feel questions to note while testing</h3>${FEEL.map((q,i)=>`<div class="guide-item"><input type="checkbox" ${S.feel[i]?'checked':''} onchange="S.feel[${i}]=this.checked;save()" aria-label="Noted"><div>${q}</div></div>`).join('')}
  <label class="f" style="margin-top:10px" for="gnotes">Your notes</label><textarea id="gnotes" oninput="S.notes=this.value;save()">${esc(S.notes)}</textarea>`;
}
function takeMe(id){const s=SCEN.find(x=>x[0]===id);try{s[2]()}catch(e){console.error(e);toast('Could not set up '+id)}save();if(drawerKind==='guide')closeDrawer();render();toast('Set up: '+id+'.')}

/* ============ Keyboard (review cards) ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').innerHTML){closeModal();return}if(S.kb){S.kb=null;render();return}if(!$('#drawer').hidden){closeDrawer();return}}
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if($('#modal').innerHTML)return;
  const r=route();if(r[0]!=='batch'||(r[2]&&r[2]!=='attention'))return;
  const cards=[...document.querySelectorAll('[data-card]')].map(x=>x.dataset.card);if(!cards.length)return;
  const k=e.key.toLowerCase();let i=cards.indexOf(S.focus);
  if(k==='j'||k==='k'){i=k==='j'?Math.min(cards.length-1,i+1):Math.max(0,i<0?0:i-1);S.focus=cards[i];S.kb=null;render();const el=document.querySelector(`[data-card="${S.focus}"]`);if(el)el.scrollIntoView({block:'center'});e.preventDefault();return}
  if(!S.focus||i<0){if('ynr'.includes(k)&&k.length===1){S.focus=cards[0];render()}return}
  if(k==='y'||k==='n'||k==='r'){S.kb={jid:S.focus,act:{y:'yes',n:'no',r:'replace'}[k]};render();e.preventDefault();return}
  if(k==='enter'&&S.kb){const {jid,act}=S.kb;S.kb=null;const {j}=findJob(jid);if(!j)return;
    if(act==='replace')replaceStart(jid);
    else if(j.path==='scene')sceneAnswer(jid,act==='yes');
    else if(act==='yes'){if(j.outcome==='pass'||j.outcome==='references_changed'||j.path==='crop')answer(jid,true);else toast('"Use as is" is not offered for this photo.')}
    else openRemove(jid);
    e.preventDefault()}
});
render();
