<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Set Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;600;700&family=Raleway:wght@400;500;600&display=swap">
<style>
/* Prototype of specs 12 (apparel shot set) and 13 (footwear and bag scene image). Look copied from catalog-prototype.html. */
:root{--navy:#131A48;--orange:#FF5800;--orange-h:#FF8C4F;--yellow:#FFFCE8;--grey:#5A5A5A;--grey-l:#CECECE;--bg:#FFFFFF;--fg:#1b1b1f;--muted:#5A5A5A;--line:#dedbd3;--card:#FFFFFF;--soft:#f6f5f0;--ok:#1f7a3f;--warn:#b86e00;--bad:#b3261e;--run:#1d2a7a;--proto:#fff1e8;--font-h:'Spectral',Georgia,serif;--font-b:'Raleway','Segoe UI',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1330;--fg:#f1f1f4;--muted:#b9bcc9;--line:#2b315c;--card:#171c3f;--soft:#141839;--yellow:#2a2a1a;--grey-l:#3a3f66;--ok:#6fd49a;--warn:#f0b35a;--bad:#ff8a80;--run:#c9d0ff;--proto:#2e1d14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1330;--fg:#f1f1f4;--muted:#b9bcc9;--line:#2b315c;--card:#171c3f;--soft:#141839;--yellow:#2a2a1a;--grey-l:#3a3f66;--ok:#6fd49a;--warn:#f0b35a;--bad:#ff8a80;--run:#c9d0ff;--proto:#2e1d14;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;margin:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;margin:0;text-wrap:balance;color:var(--fg)}
h1{font-size:30px;font-weight:300;letter-spacing:-0.02em}h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
a{color:var(--orange)}
p{margin:6px 0}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.top .in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.logo{font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:-0.02em;color:#fff;text-decoration:none}
.nav a{color:#fff;text-decoration:none;opacity:.8;margin-right:14px;font-weight:500}.nav a.on{opacity:1;border-bottom:2px solid var(--orange);padding-bottom:4px}
.proto{font-size:12px;background:var(--orange);color:#fff;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ub{font:inherit;font-size:13px;font-weight:500;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;cursor:pointer}
.ub:hover{border-color:#fff}.ub:focus-visible{outline:3px solid var(--orange-h);outline-offset:2px}
.seat{display:flex;align-items:center;gap:6px;font-size:13px}
.seat select{font:inherit;font-size:13px;background:#1f2760;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:5px 8px}
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lead{color:var(--muted);max-width:68ch;margin-top:6px}
.btn{font-family:var(--font-b);font-weight:600;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.3}
:root[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.ok):not(.danger){background:#2c3680;border-color:#3d4aa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.primary):not(.ghost):not(.ok):not(.danger){background:#2c3680;border-color:#3d4aa0}}
.btn.primary{background:var(--orange);border-color:var(--orange)}.btn.primary:hover{background:var(--orange-h);border-color:var(--orange-h)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--grey-l)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}.btn:focus-visible{outline:3px solid var(--orange-h);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{font:inherit;background:none;border:0;padding:0;color:var(--orange);cursor:pointer;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
.tw table{min-width:640px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--fg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:#e4f5ea;color:#145a2e;border-color:#bfe5cc}.pill.warn{background:#fff3dc;color:#7a4a00;border-color:#f3d79a}.pill.run{background:#e8ecff;color:#1d2a7a;border-color:#c3cbff}.pill.bad{background:#fde7e5;color:#8a1c16;border-color:#f6b9b4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.ok{background:#173a26;color:#9fe3b6;border-color:#245a3a}:root:not([data-theme="light"]) .pill.warn{background:#3d2e10;color:#f5cf85;border-color:#5c4518}:root:not([data-theme="light"]) .pill.run{background:#1f2a66;color:#c9d0ff;border-color:#33408a}:root:not([data-theme="light"]) .pill.bad{background:#4a1b18;color:#ffb3ad;border-color:#6d2a25}}
:root[data-theme="dark"] .pill.ok{background:#173a26;color:#9fe3b6;border-color:#245a3a}:root[data-theme="dark"] .pill.warn{background:#3d2e10;color:#f5cf85;border-color:#5c4518}:root[data-theme="dark"] .pill.run{background:#1f2a66;color:#c9d0ff;border-color:#33408a}:root[data-theme="dark"] .pill.bad{background:#4a1b18;color:#ffb3ad;border-color:#6d2a25}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--grey-l);font-size:13px}
.steps li.on{color:var(--fg)}.steps li.on::before{background:var(--orange);border-color:var(--orange);color:#fff}
.steps li.done::before{background:var(--navy);border-color:var(--navy);color:#fff;content:"\2713"}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=date],textarea{font:inherit;padding:8px 10px;border:1px solid var(--grey-l);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
.full{width:100%}
textarea{min-height:80px;resize:vertical;width:100%}
.help{color:var(--muted);font-size:13px;margin-top:6px}
.note{color:var(--muted);font-size:12px;font-style:italic}
.drop{border:2px dashed var(--grey-l);border-radius:10px;padding:22px;text-align:center;background:var(--soft);cursor:pointer}
.drop:hover{border-color:var(--orange)}.drop b{display:block;font-size:16px;margin-bottom:4px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;cursor:pointer}
.opt input{width:18px;height:18px;margin-top:3px;accent-color:var(--orange)}
.opt small{display:block;color:var(--muted)}
.opt.inline{display:inline-grid;margin-left:8px}
.chan{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ch{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.ch input{width:18px;height:18px;margin-top:3px;accent-color:var(--orange)}
.ch.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset}
.ch b{display:block}.ch small{color:var(--muted);display:block;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.kpi{padding:10px 14px;border-left:3px solid var(--navy);background:var(--soft);border-radius:6px}.kpi b{display:block;font-size:22px;font-family:var(--font-h);font-weight:600}.kpi span{color:var(--muted);font-size:13px}
.kpi.o{border-left-color:var(--orange)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 16px;flex-wrap:wrap}
.tabs a{font-weight:600;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);text-decoration:none}
.tabs a.on{color:var(--fg);border-bottom-color:var(--orange)}
.banner{display:grid;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.banner .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1 1 200px;min-width:120px}.bar i{display:block;height:100%;background:var(--orange);border-radius:999px}
.notice{background:var(--yellow);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin:10px 0}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.err{border-left:3px solid var(--bad);background:var(--soft);padding:10px 12px;border-radius:6px;margin:8px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(19,26,72,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal .card{max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);z-index:25;overflow:auto;padding:16px 16px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer h2{font-size:20px}
.drawer section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.drawer .sw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.drawer .sw select{font-size:13px;padding:4px 6px}
.pbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7a2e00;background:#ffe2cf;border:1px dashed var(--orange);border-radius:6px;padding:2px 8px}
:root[data-theme="dark"] .pbadge{color:#ffd2b5;background:#3a2213}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbadge{color:#ffd2b5;background:#3a2213}}
.protobox{border:1px dashed var(--orange);background:var(--proto);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px}
.chain{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;margin:8px 0}
.chain span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.chain span.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.chain span.done{background:var(--soft);color:var(--muted)}
.guide-item{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.guide-item input{width:18px;height:18px;accent-color:var(--orange);margin-top:2px}
.guide-item .gid{font-weight:700;margin-right:4px}
/* Images */
svg.ph{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:#ecebe7}
figure{margin:0}
figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.strip figure{width:64px;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.thumbs figure{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin:2px 4px 0 0}
.badge.cut{background:#fde7e5;color:#8a1c16}.badge.made{background:#e8ecff;color:#1d2a7a}.badge.crop{background:#e4f5ea;color:#145a2e}
/* Review cards */
.att{display:grid;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);outline:none}
.rc.focus{box-shadow:0 0 0 3px var(--orange-h)}
.rc header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.rc-main{display:grid;grid-template-columns:minmax(0,220px) minmax(0,150px) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
.rc-main.two{grid-template-columns:minmax(0,180px) minmax(0,180px) minmax(0,1fr)}
.rc-main.scene{grid-template-columns:minmax(0,110px) minmax(0,230px) minmax(0,1fr)}
@media (max-width:820px){.rc-main,.rc-main.two,.rc-main.scene{grid-template-columns:1fr 1fr}.rc-main .why{grid-column:1/-1}}
.why p{margin:4px 0 10px}
.checkline{border-left:3px solid var(--navy);padding:6px 10px;background:var(--soft);border-radius:4px;font-size:14px}
.answers{font-size:13px;color:var(--muted);margin:8px 0}
.result{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--soft)}
.picks{display:grid;gap:2px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.picks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.picks input{accent-color:var(--orange);margin-top:3px}
.qlist{display:grid;gap:4px;margin:8px 0}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.qrow small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.qrow small.bad{color:var(--bad)}
.yn{display:inline-flex;border:1px solid var(--grey-l);border-radius:6px;overflow:hidden}
.yn button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--fg);padding:3px 10px;cursor:pointer}
.yn button.on{background:var(--navy);color:#fff}
.yn button.on.no{background:var(--bad)}
.kbd{font-family:ui-monospace,Consolas,monospace;border:1px solid var(--grey-l);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
.crops{display:flex;gap:8px;flex-wrap:wrap}
.crops figure{width:64px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.chip.ok{background:#e4f5ea;color:#145a2e;border-color:#bfe5cc}.chip.warn{background:#fff3dc;color:#7a4a00;border-color:#f3d79a}.chip.bad{background:#fde7e5;color:#8a1c16;border-color:#f6b9b4}.chip.run{background:#e8ecff;color:#1d2a7a;border-color:#c3cbff}
.pend{color:var(--muted);font-style:italic}
.plist{display:grid;gap:12px}
.prow{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px}
@media (max-width:760px){.prow{grid-template-columns:1fr}}
.chrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;align-items:start;font-size:13px;padding:3px 0}
.lines{margin:0;padding-left:18px}.lines li{margin:4px 0}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.subnav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);font-size:14px}
.subnav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.faces svg{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#ecebe7}
.sheet table td,.sheet table th{white-space:nowrap;font-size:13px;padding:7px 9px}
.sheet td.notes{white-space:normal;min-width:320px}
.sheet td.wrap{white-space:normal;min-width:220px}
.sheet .merged{text-align:center;background:var(--soft);font-weight:600}
.legend{display:grid;gap:6px;margin-top:12px;font-size:14px}
.legend div{display:grid;grid-template-columns:140px 1fr;gap:10px}
@media (max-width:560px){.legend div{grid-template-columns:1fr}}
.inline-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rolelist{display:grid;gap:6px;margin:8px 0}
.rolelist .rr{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center}
.bars{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:14px}
.bars li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.bars .y{color:var(--ok);font-weight:700}.bars .n{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.sm{font-size:13px}
.hide{display:none!important}
.att,.plist{grid-template-columns:minmax(0,1fr)}
.prow>*,.rc-main>*,.rc,.chrow>*{min-width:0}
.pill.warn{white-space:normal}
.inline-sel label{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:100%}
.inline-sel select{max-width:100%;min-width:0}
/* v2: spot checks, fix and try again, Brand DNA, Ops */
details>summary{cursor:pointer;color:var(--orange);font-weight:600}
.sub{margin:2px 0 8px 26px;display:grid;gap:6px;font-size:13px}
.thumbpick{display:flex;gap:6px;flex-wrap:wrap}
.thumbpick label{display:grid!important;gap:2px;justify-items:center;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--card)}
.thumbpick label:has(input:checked){border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.thumbpick svg{width:40px}
.ask{border-left:3px solid var(--navy);background:var(--card);padding:6px 10px;border-radius:4px;font-size:13px;margin-top:6px}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;margin-top:12px}
.pc{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.pc .imgs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pc .imgs.one{grid-template-columns:minmax(0,160px)}
.seg{display:inline-flex;border:1px solid var(--grey-l);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--fg);padding:5px 12px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:#3d4aa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#3d4aa0}}
.swatch{display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.st{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,80px));gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){h1{font-size:25px}.top .in{gap:8px}.nav a{margin-right:8px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="logo" href="#home">Opptra</a>
  <nav class="nav" id="nav"></nav>
  <div class="tright">
    <span class="proto">Prototype only</span>
    <label class="seat">You are
      <select id="seat" onchange="setSeat(this.value)" aria-label="You are">
        <option value="naz">Operator</option>

    else if(p.dept==='unknown')res={reason:'department_unset'};
    else if(!ctx.make)res={reason:ctx.makeReason};
    else if(r==='pk')res=p.pkOk?{path:'mode_a',refs:photos.map(f=>f.n)}:{reason:'no_pieces'};
    else if(PERSON.has(r)&&!onModel){

      else if(hasFlat)res={reason:'no_brand_model'};

    }
    else if(!views.has(BACK.has(r)?'back':'front'))res={reason:'no_view'};
    else if(photos.length<2)res={reason:'cannot_check'};

    return memo[r]=res;

    if(sl.occ){j.retires=sl.occ;j.retireCut=sl.occCut;if(!j.retireChs.includes(ch))j.retireChs.push(ch)}

    if(!jobs.fl)list.push({role:'fl',path:'mode_b',refs:photos.filter(f=>f.role==='flat').map(f=>f.n),retireChs:[]});
    list.forEach(j=>{if(j.path==='mode_b'){if(j.role==='fl')j.anchor=true;else j.waitAnchor=true}});

function summary(b){

function sceneElig(b,p,ignoreMode){

  if(!prof||!prof.enabled||!benchOk)return {skip:'No scene image: scene images are switched off for this brand.',brandOff:true};
  const scope=S.rights[p.brand]?S.rights[p.brand].scope:'none';
  if(scope==='none')return {skip:"No scene image: the brand's written permission for generated images is not on record.",brandOff:true,noRights:true};
  if(p.photos.some(f=>['worn','carried','scene'].includes(f.presence)))return {skip:"No scene image needed: the brand's photos already show it worn or in a scene.",worn:true};
  if(!p.sub||p.sub==='unknown')return {skip:'No scene image: the type of shoe or bag is not known yet.',unknownSub:true};
  const entry=prof.subcategories[p.sub]||{};
  const full=prof.routes.full&&scope==='worn_or_carried'&&(ignoreMode||b.sceneMode!=='still_life')&&!!entry.worn;
  const comp=prof.routes.composite;
  if(!full&&!comp)return {skip:'No scene image: the brand allows neither a worn scene nor a still life for this product.'};

  const busy=b.jobs.some(j=>BUSY.includes(j.state));
  if(!busy&&!b.finalized){b.finalized=true;snapshot(b,'When the batch finished');steps.add('publish')}

function fastForward(b){for(let i=0;i<14;i++){if(!b.jobs.some(j=>BUSY.includes(j.state))&&b.finalized)break;advanceBatch(b)}}
const NEWER=['A03','A14','B01','C01'];
function applySwitchEffects(){
  for(const id in S.batches){const b=S.batches[id];if(b.status!=='running')continue;
    if(S.sw.newer){b.jobs.forEach(j=>{if(NEWER.includes(j.pid)&&['in_review','fixing'].includes(j.state)){j.state='not_made';j.reason='superseded';b.supersededNote=true}})}

}
function spotTimeout(){let n=0;for(const id in S.batches){const b=S.batches[id];let k=0;b.jobs.forEach(j=>{if(j.state==='in_review'){j.state='not_made';j.reason='spot_timeout';k++}});if(k)snapIf(b);n+=k}return n}
function snapshot(b,label){
  const v=b.sheets.length+1;const rows=b.products.map(p=>sheetRow(b,p,v));
  b.sheets.push({v,label,at:TODAY+' '+clock(),rows});
  b.jobs.forEach(j=>{if(j.state==='live'&&!j.inV)j.inV=v});
  b.products.forEach(p=>p.photos.forEach(f=>{if(f.newV===v)f.inV=v}));
}
function attentionJobs(b){return b.jobs.filter(j=>j.state==='in_review')}
function spotProducts(b){return [...new Set(attentionJobs(b).map(j=>j.pid))]}
function needsGarment(b,p){return b.status==='running'&&p.kind==='apparel'&&p.dept==='unknown'&&!p.deptSkipped&&ctxFor(b).make}
function questions(b){return b.products.filter(p=>needsGarment(b,p))}
function needsMeCount(b){return spotProducts(b).length+questions(b).length}
function batchState(b){
  if(b.status==='draft')return {txt:'Not started (step '+(b.step||1)+')',cls:''};
  if(b.status==='done')return {txt:'Ready to download',cls:'ok'};
  const n=needsMeCount(b);
  if(n)return {txt:'Needs you ('+n+')',cls:'warn'};
  if(b.jobs.some(j=>BUSY.includes(j.state)))return {txt:'Processing',cls:'run'};
  return {txt:'Ready to download',cls:'ok'};
}
function reconcile(b,p){
  if(b.status!=='running')return '';
  const pl=planProduct(p,ctxFor(b));let added=0,dropped=0;
  pl.jobs.forEach(pj=>{const ex=b.jobs.find(j=>j.pid===p.id&&j.role===pj.role&&!['not_made','dropped','replaced'].includes(j.state));if(!ex){addJob(b,p,pj,pj.waitAnchor?'waiting':'planned');added++}});
  b.jobs.filter(j=>j.pid===p.id&&j.path!=='scene').forEach(j=>{if(['not_made','dropped','replaced'].includes(j.state))return;
    if(!pl.jobs.some(pj=>pj.role===j.role)){const filler=p.photos.find(f=>f.role===j.role&&!f.cut);j.state='dropped';j.byBrand=filler?filler.n:null;dropped++}});
  if(added)b.finalized=false;
  return (added?added+' new '+plural(added,'shot','shots')+' planned. Press Advance time. ':'')+(dropped?dropped+' made '+plural(dropped,'photo is','photos are')+' no longer needed. ':'');

/* ============ Links sheet ============ */
function liveItems(b,p,ch){
  const items=[];
  p.photos.forEach(f=>{if(b.jobs.some(j=>j.pid===p.id&&j.state==='live'&&j.retires===f.n&&j.retireChs.includes(ch)))return;items.push({n:f.n,role:f.role,kind:'brand',cut:f.cut})});
  b.jobs.filter(j=>j.pid===p.id&&j.state==='live'&&j.path!=='scene').forEach(j=>items.push({n:j.n,role:j.role,kind:j.path==='crop'?'derived':'generated',parent:j.parent}));
  const used=new Set(),order=[],missing=[];const rank=x=>({brand:0,derived:1,generated:2}[x.kind]*1000+x.n);
  if(p.kind==='apparel')entriesFor(p,ch).forEach(e=>{const alts=Array.isArray(e)?e:[e];for(const a of alts){const c=items.filter(it=>it.role===a&&!it.cut&&!used.has(it)).sort((x,y)=>rank(x)-rank(y))[0];if(c){used.add(c);order.push(c);return}}missing.push(e)});
  items.filter(it=>!used.has(it)).sort((x,y)=>x.n-y.n).forEach(it=>order.push(it));
  const ls=b.jobs.find(j=>j.pid===p.id&&j.path==='scene'&&j.state==='live');
  let sceneWhy=null;
  if(ls){const r=sceneChannel(b,p,ch,order.length);if(r.ok)order.push({n:ls.n,role:'ls',kind:'generated',route:ls.route});else sceneWhy=r.why}
  return {order,missing,sceneWhy};
}
function sceneChannel(b,p,ch,count){
  if(S.rights[p.brand].scope==='none')return {ok:false,why:"Not added: the brand's written permission for generated images is not on record."};
  if(S.chScene[ch].life==='off'||(S.sw.noScene&&ch==='namshi'))return {ok:false,why:'Not added: this marketplace does not take scene images.'};
  const max=S.chScene[ch].max;
  if((S.sw.trendyolFull&&ch==='trendyol')||(max&&count+1>max))return {ok:false,why:'Not added: this marketplace already has its maximum number of photos.'};
  return {ok:true,pos:count+1};
}
function notesFor(b,p){
  const N=[];
  if(p.kind==='apparel'){
    const pl=planProduct(p,ctxFor(b));
    for(const ch of b.channels)(pl.slots[ch]||[]).forEach(sl=>{
      if(sl.state==='filled')return;
      const j=b.jobs.find(x=>x.pid===p.id&&x.role===sl.role&&x.state!=='dropped');
      let reason=null;
      if(b.status==='done')reason='not_active';
      else if(j){if(j.state==='not_made')reason=j.reason;else return}
      else reason=sl.via.reason;
      if(!reason)return;
      N.push(notMade(reason,ch,sl.role,p));
      if(sl.state==='occupied_cut')N.push(`Photo ${sl.occ} is still used: no replacement could be made.`);
    });
    b.jobs.filter(j=>j.pid===p.id&&j.state==='live'&&j.retires).forEach(j=>j.retireChs.forEach(ch=>N.push(`Photo ${j.retires} was replaced on ${CH[ch]} because ${j.retireCut==='head'?'the face was cut at the top edge':'the product was cut at the frame edge'}.`)));
    pl.cutKept.forEach(n=>N.push(`Photo ${n} is still used: it is cut at the edge and no shot type the channel asks for replaces it.`));
    b.jobs.filter(j=>j.pid===p.id&&j.state==='dropped'&&j.byBrand&&j.inV).forEach(j=>N.push(`Photo ${j.n} was replaced by the brand's own photo ${j.byBrand}.`));
  }else{
    const e=sceneElig(b,p);const j=b.jobs.find(x=>x.pid===p.id&&x.path==='scene'&&x.state!=='dropped');
    if(!j){if(e&&e.skip)N.push(e.skip)}
    else if(j.state==='live')b.channels.forEach(ch=>{const L=liveItems(b,p,ch);if(L.sceneWhy)N.push(`${CH[ch]}: ${L.sceneWhy}`);else N.push(`${CH[ch]} img ${L.order.length}: ${j.route==='composite'?"The brand's own product photo placed in an AI-made scene.":"Scene image made by AI from the brand's photos."}`)});
    else if(j.state==='not_made')N.push(sceneNotMade(j));
    else if(j.state==='replaced')N.push("Generated scene image removed: the brand's own worn photo replaced it.");
    else if(j.state==='fixing')N.push('Brand photos are live; the scene image is being fixed.');
    else if(b.status==='running')N.push(j.state==='in_review'?'Brand photos are live; the scene image waits for a spot check.':'Brand photos are live; the scene image is on its way.');
  }
  return [...new Set(N)];
}
function sheetRow(b,p,v){
  const jobsP=b.jobs.filter(j=>j.pid===p.id);
  const pending=jobsP.some(j=>PENDING.includes(j.state));
  const fresh=jobsP.filter(j=>j.state==='live'&&!j.inV);
  const freshBrand=p.photos.some(f=>f.newV===v);
  let change;
  if(pending)change='pending_review';
  else if(fresh.some(j=>j.retires))change='cut_replaced';
  else if(fresh.some(j=>j.path!=='scene'))change='role_added';
  else if(fresh.some(j=>j.path==='scene'))change='scene_added';
  else if(freshBrand)change='updated';
  else change=(v===1&&b.kind!=='upload')?'new':'unchanged';
  if(v===1&&b.kind!=='upload'&&!pending)change='new';
  const ch={};
  b.channels.forEach(c=>{const L=liveItems(b,p,c);
    ch[c]={links:L.order.map(it=>`.../${c}/${p.key}_${it.n}.jpg`),
      shots:L.order.map((it,i)=>`${i+1} ${roleWord(it.role,p)}${it.kind==='derived'?` (cut from photo ${it.parent})`:it.kind==='generated'?' (made)':''}`).join(', '),
      missing:L.missing.map(e=>entryWords(e,p)).join(', '),
      ai:L.order.map((it,i)=>it.kind==='generated'?`${i+1} yes`:null).filter(Boolean).join(', ')}});
  return {key:p.key,name:p.name,brand:BRANDS[p.brand],ch,status:'ok',change,todo:whatToDo(b,p,change,fresh,freshBrand),notes:notesFor(b,p)};
}
/* "What to do" (spec 12 s8.4): one plain action per product, computed from change and the slots, never typed. */
function whatToDo(b,p,change,fresh,freshBrand){
  if(change==='pending_review')return 'Nothing yet: new photos waiting for a spot check';
  let chs=[];
  if(change==='new'||change==='updated'||freshBrand)chs=b.channels.slice();
  else if(['role_added','cut_replaced','scene_added'].includes(change))chs=b.channels.filter(c=>liveItems(b,p,c).order.some(it=>it.kind!=='brand'&&fresh.some(j=>j.n===it.n)));
  if(chs.length)return 'Re-submit images on '+andList(chs.map(c=>CH[c]));
  if(p.kind==='apparel'){const pl=planProduct(p,ctxFor(b));const add=new Set();
    for(const c of b.channels)(pl.slots[c]||[]).forEach(sl=>{if(sl.state==='filled')return;const r=sl.via&&sl.via.reason;if(r==='no_view')add.add(`a photo of the ${BACK.has(sl.role)?'back':'front'}`);if(r==='cannot_check')add.add('a larger photo')});
    if(add.size)return 'Add more photos: '+andList([...add]);}
  return 'Nothing to do';
}

function missingSentences(b,p){
  if(p.kind!=='apparel'||b.status==='draft')return [];
  const pl=planProduct(p,ctxFor(b));const groups={};
  for(const ch of b.channels)(pl.slots[ch]||[]).forEach(sl=>{if(sl.state==='filled')return;
    const j=b.jobs.find(x=>x.pid===p.id&&x.role===sl.role&&x.state!=='dropped');
    let reason;if(b.status==='done')reason='not_active';else if(j){if(j.state!=='not_made')return;reason=j.reason}else reason=sl.via.reason;
    if(!reason)return;const k=sl.role+'|'+reason;(groups[k]=groups[k]||{role:sl.role,reason,chs:[]}).chs.push(ch)});
  return Object.values(groups).map(g=>{const s=notMade(g.reason,g.chs[0],g.role,p);const m=s.match(/ (not made(?: yet)?): (.*)$/);const tail=m?`${m[1]}. ${m[2].charAt(0).toUpperCase()+m[2].slice(1)}`:'missing.';const R=roleWord(g.role,p);
    return `${R.charAt(0).toUpperCase()+R.slice(1)} on ${andList(g.chs.map(c=>CH[c]))}: ${tail}`});
}

function markRetire(brand,id){const m=findMark(brand,id);m.status='retired';render();toast(`"${m.label}" retired. It is no longer used in checks; its history stays.`)}
function addLogoModal(brand){modal(`<h3>Add a logo file</h3><p class="sm">The file is checked like any other photo. Adding it never approves it: it shows up as a suggestion.</p><div class="drop" onclick="this.innerHTML='<b>logo.png</b>Ready to add';document.getElementById('lgo').disabled=false"><b>Drop the logo file here</b>Or click to choose (prototype: any click adds a file).</div><label class="f" for="lgn" style="margin-top:10px">Name</label><input type="text" id="lgn" class="full" placeholder="For example: Cat logo"><p class="f" style="margin-top:10px">Where did this come from?</p><label class="opt"><input type="radio" name="lgs" value="The brand sent it" checked><span>The brand sent it</span></label><label class="opt"><input type="radio" name="lgs" value="From the brand's website"><span>The brand's website</span></label><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="lgo" disabled onclick="doAddLogo('${brand}')">Add</button></div>`)}
function doAddLogo(brand){const name=$('#lgn').value.trim();const src=(document.querySelector('input[name="lgs"]:checked')||{}).value;S.dna[brand].marks.push({id:'m'+Date.now(),label:name,kind:'Logo',shape:'wordmark',text:(name||BRANDS[brand]).toUpperCase().slice(0,14),color:'#24305e',status:'candidate',seen:0,src});closeModal();render();toast('Added as a suggestion. Approve it to use it in checks.')}
function tWords(brand){const W=S.dna[brand].words;const appr=W.map((w,i)=>[w,i]).filter(x=>x[0].status==='approved'),cand=W.map((w,i)=>[w,i]).filter(x=>x[0].status==='candidate');
  return `<p class="notice">A made photo fails if it shows a word that is almost, but not exactly, one of these. Brand words are used only to check made photos.</p>
  <h3 style="margin-top:14px">Approved</h3><div class="chips">${appr.map(([w,i])=>`<span class="chip ok">${esc(w.text)} . seen on ${w.seen} products <button class="link sm" onclick="wordSet('${brand}',${i},'removed')">Remove</button></span>`).join('')||'<span class="muted">None yet.</span>'}</div>
  <h3 style="margin-top:14px">Suggestions</h3><p class="help">A word seen on at least 5 products. Tick the right spellings.</p>${cand.length?`<div class="picks">${cand.map(([w,i])=>`<label><input type="checkbox" onchange="wordSet('${brand}',${i},'approved')"> ${esc(w.text)} <span class="muted sm">seen on ${w.seen} products</span></label>`).join('')}</div>`:'<p class="muted">No suggestions right now.</p>'}
  <div class="inline-sel" style="margin-top:12px"><label>Add a word <input type="text" id="nw" placeholder="Exact spelling"></label><button class="btn sm" onclick="wordAdd('${brand}')">Add a word</button></div>`}
function wordSet(brand,i,st){const w=S.dna[brand].words[i];w.status=st;render();toast(st==='approved'?`"${w.text}" approved.`:`"${w.text}" removed.`)}
function wordAdd(brand){const v=($('#nw').value||'').trim();if(!v){toast('Type the exact spelling first.');return}S.dna[brand].words.push({text:v,seen:0,status:'approved',by:'Admin'});render();toast(`"${v}" added and approved.`)}
/* Models: person groups and packs per audience (men, women, kids). Decision 27 Oct 2026: kids models are kept too. */
const AUDS=[['women','Women'],['men','Men'],['kids','Kids']];
function tModels(brand){
  const R=S.registry[brand];const aud=S.open.modAud||'women';
  if(R.deleted)return `<div class="card" style="margin-top:14px"><h3>No model data for ${BRANDS[brand]}</h3><p class="muted">This brand's model data was deleted on ${TODAY}. Published product images stay.</p><button class="btn" onclick="restoreReg('${brand}')">Prototype: collect photos again</button></div>`;
  const seg=`<div class="seg" role="group" aria-label="Audience">${AUDS.map(([k,l])=>`<button class="${aud===k?'on':''}" onclick="S.open.modAud='${k}';render()">${l} (${R.packs.filter(x=>x.aud===k&&x.status==='approved').length})</button>`).join('')}</div>`;
  const kidsNote=aud==='kids'?`<div class="notice"><b>Admin only.</b> Storing children's face data: legal confirmation recommended before go-live.</div><p class="help">Kids models are kept like the adult ones. A made photo shows a child only on an approved kids model, only where the marketplace allows it and under the kids rules. Kids scenes show legs or feet only unless the Scenes tab names an approved kids model.</p>`:'';
  const rm=R.removed[aud]||[];const G=R.groups.filter(g=>g.aud===aud);const hair=(G[0]||{}).hair||'#3b2b22';
  const contact=Array.from({length:aud==='kids'?6:12},(_,i)=>i).filter(i=>!rm.includes(i)).map(i=>{const r=['fl','hs','bh','fm'][i%4];return `<figure>${apparelImg({g:i%3===1?'dress':'top',color:['#e8dcc4','#9cc3e4','#b5562f','#24305e'][i%4],length:'short'},r,{hair,child:aud==='kids'})}<figcaption>${ROLE_WORDS[r]}<br><button class="link sm" onclick="removeRegPhoto('${brand}','${aud}',${i})">Remove</button></figcaption></figure>`}).join('');
  const groups=G.map(g=>{const gi=R.groups.indexOf(g);return `<div class="prow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${g.status==='confirmed'?esc(g.label):'Group '+(G.indexOf(g)+1)}</b> <span class="muted sm">${g.size} photos</span> <span class="pill ${g.status==='confirmed'?'ok':g.status==='rejected'?'bad':''}">${{candidate:'To confirm',confirmed:'Same person, confirmed',rejected:'Not usable'}[g.status]}</span><div class="faces" style="margin-top:8px">${Array.from({length:Math.min(g.size,8)},(_,i)=>faceSVG(g.mixed&&i%2?'#a8743a':g.hair,i+gi)).join('')}</div>${g.mixed?'<p class="help">These may be two people. Use Split if so.</p>':''}${g.status==='confirmed'&&!g.packed?packApprove(brand,gi,g):''}</div>
    <div class="acts">${g.status==='candidate'?`<button class="btn ok sm" onclick="grp('${brand}',${gi},'same')">Same person</button><button class="btn ghost sm" onclick="grp('${brand}',${gi},'split')">Split</button><button class="btn ghost sm" onclick="grp('${brand}',${gi},'bad')">Not usable</button>`:''}</div></div>`}).join('');
  const packs=R.packs.filter(k=>k.aud===aud).map(k=>{const i=R.packs.indexOf(k);const tiles=['fl','hs','bh','fm'].map(r=>`<figure>${apparelImg({g:'top',color:'#d6d1c4',length:'short'},r,{hair,child:aud==='kids'})}<figcaption>${ROLE_WORDS[r]}${r==='fl'?' with face':''}</figcaption></figure>`).join('');
    return `<div class="card"><div class="hdr" style="margin:0"><h3>${esc(k.label)}, version ${k.version}</h3><span class="pill ${k.status==='approved'?'ok':''}">${k.status==='approved'?'Approved':'Retired'}</span></div><p class="sm muted">For ${k.depts.map(d=>GARMENT_WORD[d]).join(', ')}. An approved pack is never edited; a change is a new version.</p>
    <div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:8px">${tiles}</div>
    <div class="inline-sel" style="margin-top:10px"><label>The brand allows this model until <input type="date" value="${k.until||''}" onchange="S.registry['${brand}'].packs[${i}].until=this.value;save()"></label></div>
    <div class="acts" style="margin-top:10px">${k.status==='approved'?`<button class="btn ghost sm" onclick="retireModel('${brand}',${i})">Retire</button>`:''}<button class="btn danger sm" onclick="delModel('${brand}',${i})">Delete this model's data</button></div></div>`}).join('');
  return `<div class="hdr" style="margin:6px 0 10px;align-items:center">${seg}<button class="btn" onclick="addModelPhotos('${brand}')">Add photos</button></div>${kidsNote}
  <p class="muted sm">Faces are grouped within this brand only and never shown anywhere else.</p>
  <h3 style="margin:14px 0 8px">Contact sheet</h3><p class="muted sm">Usable photos of the brand's own ${aud==='kids'?'kids':aud} models, tagged by shot type.</p><div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">${contact||'<p class="muted">No photos.</p>'}</div>
  <h3 style="margin:18px 0 8px">Person groups</h3>${groups?`<div class="plist">${groups}</div>`:'<p class="muted">No groups to confirm.</p>'}
  <h3 style="margin:18px 0 8px">Model packs</h3><p class="help">One pack per person: full length front with face, head and shoulders, back to the hips, and front to mid-thigh if there is one.</p>${packs||'<p class="muted">No pack yet. Confirm a person group first (Same person).</p>'}`;
}
function packApprove(brand,gi,g){const opts=g.aud==='kids'?['kids']:['tops','dresses_jumpsuits','bottoms','outerwear'];return `<div class="picks" style="margin-top:10px"><b>Approve a model pack for ${esc(g.label)}</b><div class="chips">${opts.map(d=>`<label class="chip"><input type="checkbox" checked class="pdept-${gi}" value="${d}"> ${GARMENT_WORD[d]}</label>`).join('')}</div><div class="acts" style="margin-top:6px"><button class="btn primary sm" onclick="approvePack('${brand}',${gi})">Approve</button></div></div>`}
function grp(brand,gi,act){const R=S.registry[brand];const g=R.groups[gi];
  if(act==='same'){const n=R.packs.filter(k=>k.aud===g.aud).length+R.groups.filter(x=>x.aud===g.aud&&x.status==='confirmed'&&!x.packed).length;g.status='confirmed';g.label=`${BRANDS[brand]} ${g.aud==='kids'?'kids ':''}model ${String.fromCharCode(65+n)}`;toast(`Confirmed as ${g.label}. It can now become a model pack.`)}
  if(act==='bad'){g.status='rejected';toast('Marked not usable.')}
  if(act==='split'){const half=Math.floor(g.size/2);R.groups.splice(gi+1,0,{id:g.id+'b',size:g.size-half,hair:'#a8743a',status:'candidate',aud:g.aud});g.size=half;g.mixed=false;toast('Split into two groups.')}
  render()}
function approvePack(brand,gi){const R=S.registry[brand];const g=R.groups[gi];const depts=[...document.querySelectorAll('.pdept-'+gi)].filter(x=>x.checked).map(x=>x.value);if(!depts.length){toast('Tick at least one garment type.');return}
  R.packs.push({id:'p'+Date.now(),label:g.label,aud:g.aud,status:'approved',version:1,depts,until:'',gid:g.id});g.packed=true;render();toast(`${g.label} approved. ${g.aud==='kids'?'It can be picked for kids scenes on the Scenes tab.':`Flat-lay-only products of ${BRANDS[brand]} can now be made on this model.`}`)}
function removeRegPhoto(brand,aud,i){const R=S.registry[brand];(R.removed[aud]=R.removed[aud]||[]).push(i);render();toast('Photo removed from this brand\'s model photos.')}
function retireModel(brand,i){const k=S.registry[brand].packs[i];k.status='retired';render();toast(`${k.label} retired: not used for new photos. Photos already made stay.`)}
function delModel(brand,i){const k=S.registry[brand].packs[i];const word='DELETE '+k.label.replace(BRANDS[brand]+' ','').toUpperCase();
  modal(`<h3>Delete this model's data</h3><p>Deletes this person's face data, group, packs and photos. Photos in progress that use this model will not be made. Published product images stay. Only after the owner's typed yes.</p><p>Type <b class="mono">${word}</b> to confirm.</p><input type="text" id="delw" class="full" aria-label="Type to confirm" oninput="document.getElementById('delgo').disabled=this.value!=='${word}'" autocomplete="off"><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="delgo" disabled onclick="doDelModel('${brand}',${i})">Delete</button></div>`)}
function doDelModel(brand,i){const R=S.registry[brand];const k=R.packs[i];R.packs.splice(i,1);const g=R.groups.find(x=>x.id===k.gid);let photos=0;if(g){photos=g.size;R.groups.splice(R.groups.indexOf(g),1)}
  let stopped=0;if(!modeBOk(brand,k.aud))for(const id in S.batches){const b=S.batches[id];if(b.brand!==brand||b.status!=='running')continue;b.jobs.forEach(j=>{const p=b.products.find(x=>x.id===j.pid);if(j.path==='mode_b'&&(p.audience||'women')===k.aud&&['planned','waiting','making','checking','in_review','fixing'].includes(j.state)){j.state='not_made';j.reason='model_removed';stopped++}})}
  closeModal();render();toast(`Deleted ${k.label}: 1 pack${g?`, 1 group, ${photos} photos`:''}. ${stopped} ${plural(stopped,'photo','photos')} in progress will not be made. Recorded with counts only.`)}
function addModelPhotos(brand){modal(`<h3>Add photos</h3><p>Photos the brand sent of its models. They are checked like any other photo before you can use them.</p><label class="f" for="mpa">Who is in them?</label><select id="mpa">${AUDS.map(([k,l])=>`<option value="${k}" ${k===(S.open.modAud||'women')?'selected':''}>${l}</option>`).join('')}</select><div class="drop" style="margin-top:10px" onclick="this.innerHTML='<b>4 photos</b>Ready to add';document.getElementById('mpo').disabled=false"><b>Drop photos here</b>Or click to choose (prototype: any click adds 4 photos).</div><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="mpo" disabled onclick="doAddModelPhotos('${brand}')">Add</button></div>`)}
function doAddModelPhotos(brand){const aud=$('#mpa').value;S.registry[brand].groups.push({id:'g'+Date.now(),size:4,hair:'#6b4a2a',status:'candidate',aud});S.open.modAud=aud;closeModal();render();toast('4 photos added as a new group to confirm.')}
function restoreReg(brand){S.registry[brand]=clone(defaultRegistry()[brand]);render()}
function tLook(brand){const L=S.dna[brand].look;const cur=L.versions[L.versions.length-1]||{bg:'#EDEDED',measured:0,light:'Soft and even',style:'',mod:''};
  return `<div class="card" style="margin-top:6px"><p><span class="swatch" style="background:${cur.bg}"></span>Background: ${cur.measured?`measured from ${cur.measured} brand photos: light grey ${cur.bg}`:'not measured yet'}</p>
  <label class="f" for="lk-l" style="margin-top:10px">Lighting</label><input type="text" id="lk-l" class="full" value="${esc(cur.light)}">
  <label class="f" for="lk-s" style="margin-top:10px">Default styling</label><textarea id="lk-s">${esc(cur.style)}</textarea>
  <label class="f" for="lk-m" style="margin-top:10px">Modesty</label><textarea id="lk-m">${esc(cur.mod)}</textarea>
  <div class="row-acts"><button class="btn primary" onclick="approveLook('${brand}')">Approve this version</button></div></div>
  <h3 style="margin-top:18px">Versions</h3>${L.versions.length?`<ul class="lines">${L.versions.map(v=>`<li>Version ${v.v}, approved by ${v.by}, ${v.at}</li>`).join('')}</ul>`:'<p class="muted">None approved yet.</p>'}`}
function approveLook(brand){const L=S.dna[brand].look;const cur=L.versions[L.versions.length-1]||{bg:'#EDEDED',measured:0};L.versions.push({v:L.versions.length+1,by:'Admin',at:TODAY,bg:cur.bg,measured:cur.measured,light:$('#lk-l').value,style:$('#lk-s').value,mod:$('#lk-m').value});render();toast(`Look version ${L.versions.length} approved. New made photos of ${BRANDS[brand]} use it.`)}
function tKids(brand){const K=S.dna[brand].kids;const pr=approvedProfile(brand);
  return `<div class="card" style="margin-top:6px"><h3>Kids layout</h3><p>${esc(K.layout)}</p><p class="help">${K.n?`Measured from ${K.n} photos with no person in them.`:'Nothing measured yet.'}</p></div>
  <div class="card"><h3>Kids scene styling</h3><p>${pr?esc(pr.subcategories.sneaker.styling.kids):'No approved scene profile yet.'}</p><p class="help">From the Scenes tab.</p></div>
  <div class="notice">A made photo shows a child only on an approved kids model of this brand (Models tab), only where the marketplace allows it, under the kids rules below. Otherwise kids clothes are shown as flat lays, packshots, on an invisible mannequin or as crops, and kids shoe scenes show legs or feet only.</div><div class="card"><h3>Kids rules</h3><p class="sm">Knees and torso covered; everyday standing, walking or sitting only; no adult in the frame; kids lingerie, underwear and swimwear are never shown on a child. These rules are fixed and cannot be edited.</p></div>
  ${K.n?`<div class="row-acts"><button class="btn primary" onclick="S.dna['${brand}'].kids.version++;render();toast('Kids look version '+S.dna['${brand}'].kids.version+' approved.')">Approve this version</button></div>`:''}`}
function tDelete(brand){const word='DELETE '+BRANDS[brand].toUpperCase();
  return `<div class="card" style="border-color:var(--bad);margin-top:6px"><h3>Delete this brand's data</h3><p>Deletes this brand's face data, person groups, model packs, model photos, logo crops and layout photos. Published product images are not affected. Only after the owner's typed yes.</p><button class="btn danger" onclick="delReg('${brand}')">Delete this brand's data</button></div>
  <p class="help">To delete one model only, use "Delete this model's data" on the Models tab. Prototype: the confirm word is <span class="mono">${word}</span>.</p>`}
function delReg(brand){const word='DELETE '+BRANDS[brand].toUpperCase();modal(`<h3>Delete this brand's data</h3><p>This deletes every face record, person group, model pack, model photo, logo crop and layout photo of ${BRANDS[brand]}. It cannot be undone. Published product images stay.</p><p>Only do this after the owner's typed yes. Type <b class="mono">${word}</b> to confirm.</p><input type="text" id="delw" class="full" aria-label="Type to confirm" oninput="document.getElementById('delgo').disabled=this.value!=='${word}'" autocomplete="off"><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="delgo" disabled onclick="doDel('${brand}')">Delete</button></div>`)}
function doDel(brand){const R=S.registry[brand];const n=R.groups.length,ph=R.groups.reduce((a,g)=>a+g.size,0),pk=R.packs.length;R.groups=[];R.packs=[];R.deleted=true;const m=S.dna[brand].marks.length;S.dna[brand].marks=[];S.dna[brand].kids.n=0;closeModal();render();toast(`Deleted: ${n} groups, ${ph} photos, ${pk} model packs, ${m} logo crops. Recorded with counts only.`)}
function aScene(brand){
  const P=S.profiles[brand];const ap=approvedProfile(brand);const d=P.draft;
  const status=ap?`<span class="pill ok">Approved version ${P.versions.length}</span> <span class="muted sm">by ${P.versions[P.versions.length-1].by}, ${P.versions[P.versions.length-1].at}</span>`:'<span class="pill">No approved profile: scene images are off for this brand</span>';
  let h=`<p style="margin-top:6px">${status}</p><p class="lead">How scene images look for this brand: the scene per type of shoe or bag, the styling for each audience, and whose face may show. A draft is used only once approved.</p>`;
  if(!d)return h+`<div class="acts"><button class="btn primary" onclick="startDraft('${brand}',true)">Start from the default</button>${ap?`<button class="btn ghost" onclick="startDraft('${brand}',false)">Edit the approved version</button>`:''}</div>`;
  const R=S.registry[brand];const modelsFor=a=>R&&!R.deleted?R.packs.filter(k=>k.status==='approved'&&(a==='unisex'?k.aud!=='kids':k.aud===a)).map(k=>k.label):[];
  const warn=[];Object.entries(d.subcategories).forEach(([k,e])=>{if(!e.worn)warn.push(`${SUBS[k]}: no worn scene. Only a still life will be made.`)});
  if(!d.routes.full&&!d.routes.composite)warn.push('Neither route is on: no scene images will be made.');
  ['men','women','unisex','kids'].forEach(a=>{if(d.person[a]!=='never'&&!S.rights[brand].likeness)warn.push(`${a}: a face needs the brand's permission for its model's likeness, which is not on record.`)});
  const subRows=Object.entries(d.subcategories).map(([k,e])=>`<tr><td><b>${SUBS[k]}</b></td><td><input type="text" value="${esc(e.worn||'')}" placeholder="No worn scene" onchange="setSub('${brand}','${k}','worn',this.value)" style="min-width:200px" aria-label="Worn scene"></td><td><select onchange="setSub('${brand}','${k}','framing',this.value)" aria-label="Framing">${Object.entries(FRAMINGS).map(([f,l])=>`<option value="${f}" ${e.framing===f?'selected':''}>${l}</option>`).join('')}</select></td><td><input type="text" value="${esc(e.stillLife)}" onchange="setSub('${brand}','${k}','stillLife',this.value)" style="min-width:160px" aria-label="Still life"></td><td class="sm">${esc(e.styling.men)}<br>${esc(e.styling.women)}</td></tr>`).join('');
  const face=a=>{const ms=modelsFor(a);return `<div class="sw" style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin:4px 0"><span>${a==='unisex'?'Unisex':a[0].toUpperCase()+a.slice(1)}</span><select aria-label="Show the face of, ${a}" onchange="S.profiles['${brand}'].draft.person['${a}']=this.value;render()"><option value="never">Nobody (legs only)</option>${ms.length?ms.map(m=>`<option value="${esc(m)}" ${d.person[a]===m?'selected':''}>${esc(m)}</option>`).join(''):`<option disabled>No approved ${a==='kids'?'kids ':''}model yet</option>`}</select></div>`};
  h+=`<div class="card"><h3>Draft</h3>
  <label class="opt"><input type="checkbox" ${d.enabled?'checked':''} onchange="S.profiles['${brand}'].draft.enabled=this.checked;render()"><span>Scene images on for this brand</span></label>
  <label class="opt"><input type="checkbox" ${d.routes.full?'checked':''} onchange="S.profiles['${brand}'].draft.routes.full=this.checked;render()"><span>Worn or carried scene<small>Drawn by AI from every usable photo of the product.</small></span></label>
  <label class="opt"><input type="checkbox" ${d.routes.composite?'checked':''} onchange="S.profiles['${brand}'].draft.routes.composite=this.checked;render()"><span>Still life<small>The brand's real cut-out placed in an AI-made scene; product pixels unchanged.</small></span></label>
  <div class="inline-sel" style="margin:8px 0"><label>Try first <select onchange="S.profiles['${brand}'].draft.routePreference=this.value"><option value="full_first" ${d.routePreference==='full_first'?'selected':''}>Worn scene, still life if it fails</option><option value="composite_first" ${d.routePreference==='composite_first'?'selected':''}>Still life, worn scene if it fails</option></select></label><label>Unisex products styled as <select onchange="S.profiles['${brand}'].draft.unisexStyling=this.value"><option value="men" ${d.unisexStyling==='men'?'selected':''}>Men</option><option value="women" ${d.unisexStyling==='women'?'selected':''}>Women</option></select></label></div>
  <h4 style="margin-top:14px">Scenes per type</h4><div class="tw"><table><thead><tr><th>Type</th><th>Worn scene</th><th>Framing</th><th>Still life</th><th>Styling (men / women)</th></tr></thead><tbody>${subRows}</tbody></table></div>

  modal(`<h3>Saved</h3><p>${CH[E.ch]}, ${ROW_LABEL[E.dept]} now asks for: ${S.policy[E.dept][E.ch].roles.map((e,i)=>`${i+1} ${entryWords(e,{})}`).join(', ')}.</p><p>Plans were run again. Vero Moda AW26 drop${A.channels.includes(E.ch)?'':` (does not include ${CH[E.ch]}; tick it on step 3 to see an effect)`}:</p><ul class="lines"><li>Products missing shots: ${before.missing} to ${after.missing}</li><li>Photos that will be made: ${before.gen} to ${after.gen}</li><li>Shots that will be cut from a bigger photo: ${before.cut} to ${after.cut}</li></ul><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();openBatch('A')">Open the batch</button></div>`)}
function planCounts(b){const ch=b.channels.length?b:Object.assign({},b,{channels:b.defCh});const s=summary(ch);let cut=0;Object.values(s.groups).forEach(g=>cut+=g.cut);return {missing:s.missing,gen:s.gen,cut}}

/* ============ Drawers: test controls and test guide ============ */
let drawerKind=null;
function openDrawer(k){drawerKind=(drawerKind===k&&!$('#drawer').hidden)?null:k;$('#drawer').hidden=!drawerKind;if(drawerKind)renderDrawer()}
function closeDrawer(){drawerKind=null;$('#drawer').hidden=true}
function curBatch(){const r=route();if(r[0]==='batch')return B(r[1]);if(r[0]==='product')return B(r[1]);if(r[0]==='new')return S.wiz.bid?B(S.wiz.bid):null;return null}
function stageOf(b){if(!b)return null;if(b.status==='draft')return b.detect.state==='running'?'detect':(b.step>=4?'detect':'collect');if(b.status==='done')return 'done';
  const st=b.lastSteps||[];if(b.jobs.some(j=>j.state==='ready'))return 'publish';if(b.jobs.some(j=>j.state==='checking'))return 'check';if(b.jobs.some(j=>['planned','making'].includes(j.state)))return 'make';return 'done'}
function renderDrawer(){

  const MO=[['auto','Automatic'],['person','Checked by a person'],['paused','Paused']];

  d.innerHTML=`<div class="hdr" style="margin:0"><h2>Test controls</h2><button class="btn ghost sm" onclick="closeDrawer()">Close</button></div><span class="pbadge">Prototype only</span><p class="sm muted">These switches fake the world. The real module has none of them.</p>
  <section><h3>Advance time</h3><p class="sm">${b?`Batch: <b>${esc(b.name)}</b>`:'Open a batch, or step 4 of the wizard.'}</p><div class="chain">${chain.map((c,i)=>`<span class="${stg===c?'on':(stg&&(chain.indexOf(stg)>i||stg==='done'))?'done':''}">${c}</span>${i<4?'&gt;':''}`).join('')}</div><button class="btn primary" onclick="advance()">Advance time</button></section>
  <section><h3>How photos go live</h3>
  ${row('Made photos',sel('modes.made',MO,S.modes.made,'Made photos'))}${row('Photo swaps (crops)',sel('modes.crops',MO,S.modes.crops,'Photo swaps'))}${row('Scene images, worn',sel('modes.scene_full',MO,S.modes.scene_full,'Scene images, worn'))}${row('Scene images, still life',sel('modes.scene_composite',MO,S.modes.scene_composite,'Scene images, still life'))}

function sevenDays(){const n=spotTimeout();render();toast(n?`7 days passed. ${n} ${plural(n,'photo was','photos were')} not made: the spot check was not done in time.`:'No spot check was waiting.')}
function setSw(path,v){
  if(path==='theme'){S.theme=v||null;render();return}
  if(path==='learn'){S.learn.mode=v;render();return}
  if(path==='swim'){const c=S.cells.swimwear_women;if(v==='true'){c.mode='auto';c.n=Math.max(c.n,20)}else{c.mode='person';c.n=6}render();return}
  if(path==='modeB'){const R=S.registry.vero_moda;if(v==='true'){if(R.deleted||!R.packs.some(k=>k.aud==='women')){S.registry.vero_moda=clone(defaultRegistry().vero_moda)}else R.packs.forEach(k=>{if(k.aud==='women')k.status='approved'});R.deleted=false}else R.packs.forEach(k=>{if(k.aud==='women')k.status='retired'});render();return}
  if(path==='scope'){S.rights.us_polo.scope=v;render();return}
  const val=v==='true'?true:v==='false'?false:v;
  const parts=path.split('.');
  if(parts[0]==='modes')S.modes[parts[1]]=val;else if(parts.length===2)S.sw[parts[0]][parts[1]]=val;else S.sw[path]=val;
  if(path==='newer'&&val){applySwitchEffects()}
  render();
}
function advance(){

  const b=curBatch();if(!b||b.status!=='running'){toast('Open a running batch first. Advance time moves its worker one step.');return}
  const steps=advanceBatch(b);render();
  toast(steps.size?'Worker step: '+[...steps].join(', ')+'.':'Nothing is running. Waiting for you in Needs me.');
}
function askReset(){modal(`<h3>Reset everything?</h3><p>Every batch, switch and admin page goes back to the start. Your ticks and notes in the test guide stay.</p><div class="row-acts"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doReset()">Reset</button></div>`)}

function takeMe(id){const s=SCEN.find(x=>x[0]===id);if(drawerKind==='guide')closeDrawer();try{s[2]()}catch(e){console.error(e);toast('Could not set up '+id)}save();render();const el=S.focus&&document.querySelector(`[data-card="${S.focus}"]`);if(el)el.scrollIntoView({block:'center'});toast('Set up: '+id+'.')}

/* ============ Keyboard (Needs me cards) ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').innerHTML){closeModal();return}if(!$('#drawer').hidden){closeDrawer();return}}
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if($('#modal').innerHTML)return;
  const r=route();if(r[0]!=='batch'||(r[2]&&r[2]!=='attention'))return;
  const cards=[...document.querySelectorAll('[data-card]')].map(x=>x.dataset.card);if(!cards.length)return;
  const k=e.key.toLowerCase();let i=cards.indexOf(S.focus);
  if(k==='j'||k==='k'){i=k==='j'?Math.min(cards.length-1,i+1):Math.max(0,i<0?0:i-1);S.focus=cards[i];render();const el=document.querySelector(`[data-card="${S.focus}"]`);if(el)el.scrollIntoView({block:'center'});e.preventDefault();return}
  if(k!=='y'&&k!=='n')return;
  const f=S.focus&&S.focus.startsWith('p-')?S.focus:cards.find(c=>c.startsWith('p-'));if(!f)return;
  const pid=f.slice(2);const b=B(r[1]);
  if(k==='y'){allGood(b.id,pid);e.preventDefault();return}
  const j=b.jobs.find(x=>x.pid===pid&&x.state==='in_review');if(j){openWrong(j.id);e.preventDefault()}
});
